function toNum(v){
  if(typeof v==='number')return v;
  if(v===null||v===undefined)return NaN;
  let s=String(v).trim();
  if(s==='')return NaN;
  s=s.replace(',', '.');
  return parseFloat(s);
}
function formatDecimalDE(n){
  if(n===null||n===undefined||n==='')return '';
  let num=Number(n);
  if(!isFinite(num))return '';
  let rounded=Math.round(num*10)/10;
  if(Number.isInteger(rounded))return String(rounded);
  return String(rounded).replace('.', ',');
}
function calcVorgabeFromIndex(idx,gender){
  let par=S.settings.reduce((a,r)=>a+r[1],0);
  let isW=gender==='w';

  let ratingRaw=isW?S.courseRatingW:S.courseRatingM;
  let rating=(ratingRaw===undefined||ratingRaw===null||ratingRaw==='')?par:Number(ratingRaw);
  let n=toNum(idx);if(!isFinite(n))n=0;
  return Math.round(n*(slope/113)+(rating-par));
}

/* ---------- Team-Vorgabe-Faktoren ---------- */
function loadTeamHcp(){try{return Object.assign({scrLow:.35,scrHigh:.15,fb:.9,chLow:.6,chHigh:.4,foAvg:.5,grLow:.6,grHigh:.4,bm:.9},JSON.parse(localStorage.getItem('gd_teamhcp')||'{}'))}catch(e){return {scrLow:.35,scrHigh:.15,fb:.9,chLow:.6,chHigh:.4,foAvg:.5,grLow:.6,grHigh:.4,bm:.9}}}
function saveTeamHcp(o){localStorage.setItem('gd_teamhcp',JSON.stringify(o))}
function updateTeamHcp(key,val){let th=loadTeamHcp();th[key]=Math.max(0,Math.min(1,Number(val)||0));saveTeamHcp(th);}
function scrambleTeamHcp(p1,p2){let f=loadTeamHcp();let lo=Math.min(p1,p2),hi=Math.max(p1,p2);return Math.round(f.scrLow*lo+f.scrHigh*hi)}
function chapmanTeamHcp(p1,p2){let f=loadTeamHcp();let lo=Math.min(p1,p2),hi=Math.max(p1,p2);return Math.round(f.chLow*lo+f.chHigh*hi)}
function foursomeTeamHcp(p1,p2){let f=loadTeamHcp();return Math.round(f.foAvg*(p1+p2))}
function greensomeTeamHcp(p1,p2){let f=loadTeamHcp();let lo=Math.min(p1,p2),hi=Math.max(p1,p2);return Math.round(f.grLow*lo+f.grHigh*hi)}
function playerHoleAlloc(p,h){let strokes=Number(S.stableHcp[p])||0;return Math.floor(strokes/18)+(S.settings[h][2]<=strokes%18?1:0)}
/* Einheitliche Verteilung eines Team-Gesamt-Vorgabewerts auf die Bahnen: an den schwersten Bahnen (niedrigster HCP-Index) zuerst, bis die Differenz aufgebraucht ist. */
function distributeHcpToHoles(totalHcp){
  let out=Array(18).fill(0);
  for(let i=0;i<18;i++)out[i]=Math.floor(totalHcp/18)+(S.settings[i][2]<=totalHcp%18?1:0);
  return out;
}

/* ---------- Team-Zuordnung (frei wählbar A/B) ---------- */
function teamMembers(letter){
  let out=[];
  for(let p=0;p<S.count;p++){if((S.teamAssign[p]||(p<2?'A':'B'))===letter)out.push(p);}
  return out;
}
function teamOf(p){return S.teamAssign[p]||(p<2?'A':'B');}
function setTeamAssign(p,letter){S.teamAssign[p]=letter;save();render();}
function teamAssignDropdown(i){
  if(S.count!==4||!TEAM_MODES.includes(S.mode))return '';
  let cur=teamOf(i);
  return `<select class="select" style="width:auto;min-width:84px" onchange="setTeamAssign(${i},this.value)"><option value="A" ${cur==='A'?'selected':''}>Team A</option><option value="B" ${cur==='B'?'selected':''}>Team B</option></select>`;
}
function teamHcpUnified(letter){
  let members=teamMembers(letter);
  if(!members.length)return 0;
  let sum=members.reduce((a,p)=>a+(Number(S.stableHcp[p])||0),0);
  return Math.round(sum/members.length* (members.length===2?2:1) ); // for 2-player teams this is simply the sum; kept explicit for clarity
}
function teamCombinedHcp(mode,letter){
  let members=teamMembers(letter);
  if(members.length<2)return Number(S.stableHcp[members[0]])||0;
  let a=Number(S.stableHcp[members[0]])||0,b=Number(S.stableHcp[members[1]])||0;
  if(mode==='chapman')return chapmanTeamHcp(a,b);
  if(mode==='foursome')return foursomeTeamHcp(a,b);
  if(mode==='greensome')return greensomeTeamHcp(a,b);
  if(mode==='scramble')return scrambleTeamHcp(a,b);
  return a+b; // count/stable: full sum of both players' own vorgabe (each plays own ball at own allowance)
}

function loadStringFactor(){try{let v=Number(localStorage.getItem('gd_string_factor'));return v>0?v:30;}catch(e){return 30;}}
function saveStringFactor(v){localStorage.setItem('gd_string_factor',String(Math.max(1,Number(v)||30)));}
function stringTeamMembers(p){return teamOf(p)==='A'?teamMembers('A'):teamMembers('B');}
function stringIsTeam(){return S.mode==='string'&&S.team&&S.count===4;}
function stringBudgetCm(p){
  let factor=loadStringFactor();
  if(stringIsTeam()){
    let mem=stringTeamMembers(p);
    let avg=mem.reduce((a,q)=>a+(Number(S.stableHcp[q])||0),0)/(mem.length||1);
    return Math.round(avg*factor);
  }
  return Math.round((Number(S.stableHcp[p])||0)*factor);
}
function stringUsedCmTotal(p){
  if(stringIsTeam()){
    let mem=stringTeamMembers(p);
    let sum=0;
    for(let h=0;h<18;h++){mem.forEach(q=>{sum+=Number(getData(['stringCm',h,q],0))||0;});}
    return sum;
  }
  let sum=0;
  for(let h=0;h<18;h++){sum+=Number(getData(['stringCm',h,p],0))||0;}
  return sum;
}
function stringRemainingCm(p){return Math.max(0,stringBudgetCm(p)-stringUsedCmTotal(p));}
function setStringCm(h,p,val){
  let v=Math.max(0,Math.round(Number(val)||0));
  let prevForHole=Number(getData(['stringCm',h,p],0))||0;
  let maxAllowed=stringRemainingCm(p)+prevForHole;
  if(v>maxAllowed)v=maxAllowed;
  setData(['stringCm',h,p],v);
  render();
}

function loadBonusOrder(){try{let a=JSON.parse(localStorage.getItem('gd_bonus_order')||'null');if(Array.isArray(a))return a;}catch(e){}return allBonus().map(x=>x[0]);}

function orderedBonusList(){
  let all=allBonus();let order=loadBonusOrder();let byName={};all.forEach(b=>byName[b[0]]=b);
  let out=[];order.forEach(n=>{if(byName[n]){out.push(byName[n]);delete byName[n];}});
  Object.values(byName).forEach(b=>out.push(b));
  return out;
}
function moveBonusOrder(name,delta){
  let order=loadBonusOrder();let all=allBonus().map(x=>x[0]);
  all.forEach(n=>{if(!order.includes(n))order.push(n);});
  order=order.filter(n=>all.includes(n));
  let i=order.indexOf(name),j=i+delta;
  if(i<0||j<0||j>=order.length)return;
  [order[i],order[j]]=[order[j],order[i]];
  saveBonusOrder(order);
}

/* ---------- Course-Handicap-Rechner ---------- */
function hcpCalculator(){
  showModal(`<h2>🧮 Course-Handicap-Rechner</h2><p>Berechnet dein Course Handicap aus Handicap-Index, Slope und Course Rating (offizielle Formel: Index × Slope/113 + (Rating − PAR)).</p>
  <div class="section"><div class="label">Abschlag</div><div class="seg two"><button id="hcGenderM" onclick="hcSetGender('m')">♂</button><button id="hcGenderW" onclick="hcSetGender('w')">♀</button></div></div>
  <div class="section"><div class="playerRow"><input class="numInput" id="hcIndex" type="text" inputmode="decimal" placeholder="Handicap-Index (z. B. 29,6)"></div></div>
  <div class="section"><div class="playerRow"><input class="numInput" id="hcSlope" type="number" placeholder="Slope (z. B. 125)" value="${S.courseSlopeM||132}"></div></div>
  <div class="section"><div class="playerRow"><input class="numInput" id="hcRating" type="text" inputmode="decimal" placeholder="Course Rating" value="${formatDecimalDE(S.courseRatingM||71.7)}"></div></div>
  <div class="section"><div class="playerRow"><input class="numInput" id="hcPar" type="number" placeholder="Platz-PAR" value="${S.settings.reduce((a,r)=>a+r[1],0)}"></div></div>
  <div class="section"><button class="secondary" onclick="calcCourseHcp()">Berechnen</button></div>
  <div id="hcResult" class="note" style="display:none"></div>
  <div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);
  applyGenderButtonStyle(document.getElementById('hcGenderM'),document.getElementById('hcGenderW'),'m');
}
function hcSetGender(g){
  applyGenderButtonStyle(document.getElementById('hcGenderM'),document.getElementById('hcGenderW'),g);
  let slopeEl=document.getElementById('hcSlope'),ratingEl=document.getElementById('hcRating');
  if(slopeEl)slopeEl.value=g==='w'?(S.courseSlopeW||132):(S.courseSlopeM||132);
  if(ratingEl)ratingEl.value=formatDecimalDE(g==='w'?(S.courseRatingW||73.5):(S.courseRatingM||71.7));
}
function calcCourseHcp(){
  let idx=toNum(document.getElementById('hcIndex').value);if(!isFinite(idx))idx=0;
  let slope=Number(document.getElementById('hcSlope').value)||113;
  let rating=toNum(document.getElementById('hcRating').value);if(!isFinite(rating))rating=0;
  let par=Number(document.getElementById('hcPar').value)||72;
  let ch=Math.round(idx*(slope/113)+(rating-par));
  let el=document.getElementById('hcResult');
  el.style.display='block';
  el.innerHTML=`Course Handicap: <b>${ch}</b>`;
}

/* ---------- Schnelleingabe (Stepper) ---------- */
function currentHoleFields(h){
  const m=S.mode;
  if(['count','short','stable','nassau','skins','string'].includes(m))return Array.from({length:S.count},(_,p)=>({label:playerName(p),path:[m,h,p]}));
  if(m==='531')return Array.from({length:3},(_,p)=>({label:playerName(p),path:['531',h,p]}));
  if(m==='vegas'||m==='fourball'||m==='bridesmaid')return Array.from({length:4},(_,p)=>({label:playerName(p),path:[m,h,p]}));
  if(m==='scramble'||m==='chapman'||m==='foursome'||m==='greensome')return [{label:'Team A',path:[m,h,0]},{label:'Team B',path:[m,h,1]}];
  if(m==='match'&&S.matchHcp&&S.count===2)return [{label:playerName(0),path:['matchhcp',h,0]},{label:playerName(1),path:['matchhcp',h,1]}];
  if(m==='fun')return Array.from({length:S.count},(_,p)=>({label:playerName(p),path:['fun','results',h,p]}));
  return null;
}
function openStepper(){
  let h=currentHoleIndex();
  let fields=currentHoleFields(h);
  if(!fields){showModal(`<h2>⚡ Schnelleingabe</h2><p>Für diesen Modus ist die Schnelleingabe nicht verfügbar, da hier mit Auswahlfeldern statt Schlagzahlen gearbeitet wird (Wolf ohne Zahlen, Bingo Bango Bongo, Matchplay ohne Vorgabe).</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);return;}
  renderStepperModal(h,fields);
}
function renderStepperModal(h,fields){
  showModal(`<h2>⚡ Loch ${h+1}</h2>
  <div class="bonusList">${fields.map((f,i)=>{
    let raw=getData(f.path,'');
    let v=raw===''?(S.settings[h][1]||4):Number(raw)||0;
    return `<div class="bonusItem"><b>${esc(f.label)}</b><div style="display:flex;align-items:center;gap:10px"><button class="smallBtn" onclick="stepperAdjust(${h},${i},-1)">−</button><span class="points" style="min-width:26px;text-align:center">${v}</span><button class="smallBtn" onclick="stepperAdjust(${h},${i},1)">+</button></div></div>`;
  }).join('')}</div>
  <div class="modalActions"><button class="close" onclick="closeModal();render()">Fertig</button><button class="close danger" onclick="stepperNextHole(${h})">Loch fertig → weiter</button></div>`);
}
function stepperAdjust(h,i,delta){
  let fields=currentHoleFields(h);
  let f=fields[i];
  let raw=getData(f.path,'');
  let v=raw===''?(S.settings[h][1]||4):Number(raw)||0;
  v=Math.max(0,Math.min(15,v+delta));
  setData(f.path,v);
  renderStepperModal(h,fields);
}
function stepperNextHole(h){S.holeDone[h]=true;save();closeModal();render();scrollToCurrentHole();}

function openSyncModal(){

  let json=JSON.stringify(payload);

  let url=location.origin+location.pathname+'#sync='+b64;
  showModal(`<h2>🔗 Sync-Code</h2><p>Teile diesen Code oder QR-Code, um den aktuellen Spielstand direkt auf ein anderes Gerät zu übertragen. Es handelt sich um einen reinen Übertragungs-Code (kein Server) – die Daten stecken vollständig im Code selbst.</p>
  <div id="qrHolder" style="display:flex;justify-content:center;margin:10px 0"></div>
  <div class="section"><textarea class="textInput" readonly style="height:80px;padding:10px" onclick="this.select()">${esc(url)}</textarea></div>
  <div class="section"><button class="secondary" onclick="copySyncLink()">📋 Link kopieren</button></div>
  <div class="section"><div class="label">Code von einem anderen Gerät einfügen</div><div class="playerRow"><input class="textInput" id="importCodeInput" placeholder="Code oder Link einfügen"><button class="smallBtn" onclick="importFromInput()">Laden</button></div></div>
  <div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);
  try{if(window.QRCode){document.getElementById('qrHolder').innerHTML='';new QRCode(document.getElementById('qrHolder'),{text:url,width:200,height:200,colorDark:'#07100b',colorLight:'#ffffff'});}}catch(e){}
  window._syncUrl=url;
}
function copySyncLink(){let url=window._syncUrl;if(!url)return;if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).catch(()=>{});}}
function importFromInput(){
  let el=document.getElementById('importCodeInput');
  let val=(el&&el.value||'').trim();
  if(!val)return;
  let b64=val;let hashIdx=val.indexOf('#sync=');
  if(hashIdx>=0)b64=val.slice(hashIdx+6);
  importSyncCode(b64);
}
function importSyncCode(b64){
  try{
    let json=decodeURIComponent(escape(atob(b64)));
    let payload=JSON.parse(json);
    if(!payload||!payload.S)throw new Error('invalid');
    window._pendingSyncPayload=payload;
    showModal(`<h2>Spielstand importieren?</h2><p>Der aktuelle Spielstand auf diesem Gerät wird überschrieben.</p><div class="modalActions"><button class="close" onclick="closeModal()">Abbrechen</button><button class="close danger" onclick="applyImportedSync()">Übernehmen</button></div>`);
  }catch(e){
    showModal(`<h2>Ungültiger Code</h2><p>Der Sync-Code konnte nicht gelesen werden.</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);
  }
}
function applyImportedSync(){
  let payload=window._pendingSyncPayload;
  if(!payload){closeModal();return;}
  S=Object.assign(blankState(),payload.S);
  save();closeModal();render();
  window._pendingSyncPayload=null;
  history.replaceState(null,'',location.pathname);
}

/* ---------- Sixes-Engine ---------- */
function sixesResetDraws(){S.sixes.blocks=[null,null,null];S.sixes.holePairing=Array(18).fill(null);save();}
function sixesBlockCount(){return S.holesMode==='full18'?3:3;}
function sixesHolesPerBlock(){return S.holesMode==='full18'?6:3;}
function sixesPairIndexForHole(h){
  if(!S.sixes.enabled)return null;
  let range=holesModeRange(S.holesMode);
  let relIdx=h-range.start;
  if(relIdx<0)return null;
  if(S.sixes.rotation==='block'){
    let perBlock=sixesHolesPerBlock();
    let b=Math.floor(relIdx/perBlock);
    let v=S.sixes.blocks[b];return (v===null||v===undefined)?null:v;
  }
  let v=S.sixes.holePairing[h];return (v===null||v===undefined)?null:v;
}
function sixesTeamsForHole(h){let k=sixesPairIndexForHole(h);if(k===null||k===undefined)return null;return SIXES_PAIRS[k];}
function sixesDrawBlock(b){
  let used=S.sixes.blocks.filter(x=>x!==null&&x!==undefined);
  let avail=[0,1,2].filter(k=>!used.includes(k));
  if(!avail.length)return;
  let pick=avail.length===1?avail[0]:avail[Math.floor(Math.random()*avail.length)];
  S.sixes.blocks[b]=pick;save();
}
function sixesDrawHole(h){
  let range=holesModeRange(S.holesMode);
  let counts=[0,0,0];
  for(let i=range.start;i<=range.end;i++){let v=S.sixes.holePairing[i];if(v!==null&&v!==undefined)counts[v]++;}
  let perPairing=Math.ceil((range.end-range.start+1)/3);
  let avail=[0,1,2].filter(k=>counts[k]<perPairing);
  if(!avail.length)avail=[0,1,2];
  let pick=avail[Math.floor(Math.random()*avail.length)];
  S.sixes.holePairing[h]=pick;save();
}
function sixesTeamValue(mode,h,pair){
  let p1=pair[0],p2=pair[1];
  if(mode==='count'){
    let g1=Number(getData(['count',h,p1],'')),g2=Number(getData(['count',h,p2],''));
    if(!g1||!g2)return null;
    let n1=S.sixes.vorgabe?g1-playerHoleAlloc(p1,h):g1;
    let n2=S.sixes.vorgabe?g2-playerHoleAlloc(p2,h):g2;
    return n1+n2;
  }
  if(mode==='stable'){
    let g1=Number(getData(['stable',h,p1],'')),g2=Number(getData(['stable',h,p2],''));
    if(!g1||!g2)return null;
    let par=S.settings[h][1];
    let a1=S.sixes.vorgabe?playerHoleAlloc(p1,h):0,a2=S.sixes.vorgabe?playerHoleAlloc(p2,h):0;
    let pt1=Math.max(0,2+(par+a1-g1)),pt2=Math.max(0,2+(par+a2-g2));
    return pt1+pt2;
  }
  if(mode==='fourball'){
    let g1=Number(getData(['fourball',h,p1],'')),g2=Number(getData(['fourball',h,p2],''));
    let a1=S.sixes.vorgabe?playerHoleAlloc(p1,h):0,a2=S.sixes.vorgabe?playerHoleAlloc(p2,h):0;
    let nets=[];if(g1)nets.push(g1-a1);if(g2)nets.push(g2-a2);
    if(!nets.length)return null;
    return Math.min(...nets);
  }
  if(mode==='chapman'||mode==='foursome'||mode==='greensome'){
    let teams=sixesTeamsForHole(h);if(!teams)return null;
    let slot=(teams[0][0]===p1&&teams[0][1]===p2)?0:1;
    let sc=Number(getData([mode,h,slot],''));
    if(!sc)return null;
    if(!S.sixes.vorgabe)return sc;
    let hcpFn=mode==='chapman'?chapmanTeamHcp:mode==='foursome'?foursomeTeamHcp:greensomeTeamHcp;
    let teamHcp=hcpFn(Number(S.stableHcp[p1])||0,Number(S.stableHcp[p2])||0);
    let allocArr=distributeHcpToHoles(teamHcp);
    return sc-allocArr[h];
  }
  return null;
}
function sixesHoleResult(mode,h){
  let teams=sixesTeamsForHole(h);if(!teams)return null;
  let v0=sixesTeamValue(mode,h,teams[0]),v1=sixesTeamValue(mode,h,teams[1]);
  if(v0===null||v1===null)return null;
  let higherBetter=mode==='stable';
  let cmp;
  if(v0===v1)cmp=-1;else if(higherBetter)cmp=(v0>v1?0:1);else cmp=(v0<v1?0:1);
  return {teams,cmp};
}
function sixesPlayerPoints(p){
  let mode=S.mode,total=0;
  for(let h=0;h<18;h++){
    let res=sixesHoleResult(mode,h);if(!res)continue;
    let side=res.teams[0].includes(p)?0:res.teams[1].includes(p)?1:-1;
    if(side===-1)continue;
    if(res.cmp===-1)continue;else if(res.cmp===side)total+=1;else total-=1;
  }
  return total;
}

function freezeCurrentSegment(){
  let toHole=currentHoleIndex(); // 0-based index of first not-done hole within current active range
  let fromHole=S.segmentStart||1;
  let toHole1=toHole; // 0-based -> holes fromHole..toHole (1-based) are considered part of this segment
  let standingsSnapshot=null;
  try{standingsSnapshot=computeStandings();}catch(e){standingsSnapshot=null;}
  let teamInfo=null;
  if(S.count===4&&TEAM_MODES.includes(S.mode)){
    teamInfo={A:teamMembers('A').map(p=>playerName(p)),B:teamMembers('B').map(p=>playerName(p))};
  }
  S.segments.push({
    fromHole:fromHole,
    toHole:toHole1,
    mode:S.mode,
    modeLabel:modeLabel(),
    count:S.count,
    team:S.team,
    teamInfo:teamInfo,
    teamFormatHcp:S.teamFormatHcp,
    holesMode:S.holesMode,
    standings:standingsSnapshot
  });
}

/* ---------- Matchplay ---------- */
function matchStatus(d,r){
  const lead=Math.abs(d);
  if(d===0) return r===0 ? {a:'Tied',b:'Tied'} : {a:'All Square',b:'All Square'};
  if(r===0) return d>0 ? {a:`${lead} Up`,b:`${lead} Down`} : {a:`${lead} Down`,b:`${lead} Up`};
  if(lead>r) return d>0 ? {a:`${lead} & ${r}`,b:'Verloren'} : {a:'Verloren',b:`${lead} & ${r}`};
  const dormie = lead===r;
  return d>0
    ? {a:`${lead} Up${dormie?' (Dormie)':''}`, b:`${lead} Down`}
    : {a:`${lead} Down`, b:`${lead} Up${dormie?' (Dormie)':''}`};
}
function matchHcpAlloc(){
  let players=S.count===4?[teamMembers('A')[0],teamMembers('B')[0]]:[0,1];
  let hA=Number(S.stableHcp[players[0]])||0, hB=Number(S.stableHcp[players[1]])||0;
  let diff=Math.round(Math.abs(hA-hB));
  let weaker = hA>hB?'A':'B';
  let alloc=distributeHcpToHoles(diff);
  let allocA=weaker==='A'?alloc:Array(18).fill(0), allocB=weaker==='B'?alloc:Array(18).fill(0);
  return {allocA,allocB,weaker};
}
function matchDiffHcp(){
  let {allocA,allocB}=matchHcpAlloc();let diff=0;
  activeHoleIndices().forEach(h=>{
    let gA=Number(getData(['matchhcp',h,0],'')), gB=Number(getData(['matchhcp',h,1],''));
    if(gA&&gB){let nA=gA-allocA[h], nB=gB-allocB[h];if(nA<nB)diff++; else if(nB<nA)diff--;}
  });
  return diff;
}
function matchGameHcp(){
  let {allocA,allocB,weaker}=matchHcpAlloc();
  let diff=matchDiffHcp();
  let range=activeHoleRange();
  let playedHoles=activeHoleIndices().filter(h=>getData(['matchhcp',h,0],'')&&getData(['matchhcp',h,1],'')).length;
  let remaining=(range.end-range.start+1)-playedHoles;
  let status=matchStatus(diff,remaining);
  let aName=playerName(0),bName=playerName(1);
  return `<div class="note">Vorgabe: ${esc(aName)} ${S.stableHcp[0]||0} · ${esc(bName)} ${S.stableHcp[1]||0} · Ausgleich für ${weaker==='A'?esc(aName):esc(bName)}.</div>

  <table class="table"><thead><tr><th class="hole">Loch</th><th>${esc(aName)}</th><th>${esc(bName)}</th><th>Ergebnis</th></tr></thead><tbody>${activeHoleIndices().map(h=>{
    let gA=getData(['matchhcp',h,0],''), gB=getData(['matchhcp',h,1],'');
    let nA=gA?Number(gA)-allocA[h]:null, nB=gB?Number(gB)-allocB[h]:null;
    let res=(nA!=null&&nB!=null)?(nA<nB?esc(aName):nB<nA?esc(bName):'Geteilt'):'';
    return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td>
    <td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${gA}" oninput="setData(['matchhcp',${h},0],this.value);liveRefresh(this)">${allocA[h]?`<span class="hcptxt">+${allocA[h]}</span>`:''}</td>
    <td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${gB}" oninput="setData(['matchhcp',${h},1],this.value);liveRefresh(this)">${allocB[h]?`<span class="hcptxt">+${allocB[h]}</span>`:''}</td>
    <td class="tiny">${res}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function matchGame(){
  if(S.matchHcp&&S.count===2)return matchGameHcp();

function rerollFun(h){

function rerollShotClubs(h,p){let n=(S.fun.shotClubs[h]?.[p]||[]).length;if(!n)return;S.fun.shotClubs[h][p]=Array.from({length:n},()=>CLUBS[Math.floor(Math.random()*CLUBS.length)]);save();render();}
function shotClubDisplay(h,p){let a=S.fun.shotClubs[h]?.[p]||[];if(!a.length)return '';return '<div class="sub" style="line-height:1.25;margin-top:3px">'+a.map((c,i)=>`${i+1}. ${esc(c)}`).join(' · ')+'</div>'}
function funPointsForHole(h){let vals=Array.from({length:S.count},(_,p)=>Number(getData(['fun','results',h,p],'')));if(isTeam()){if(vals.some(v=>!v||v<=0))return Array(S.count).fill(0);let memA=teamMembers('A'),memB=teamMembers('B');let a=memA.reduce((s,p)=>s+vals[p],0),b=memB.reduce((s,p)=>s+vals[p],0),out=Array(S.count).fill(0);if(a<b){memA.forEach(p=>out[p]=1);memB.forEach(p=>out[p]=-1);}else if(b<a){memA.forEach(p=>out[p]=-1);memB.forEach(p=>out[p]=1);}return out}return funPoints(vals)}
function funPoints(vals){let idx=vals.map((v,i)=>({v,i})).filter(x=>Number.isFinite(x.v)&&x.v>0).sort((a,b)=>a.v-b.v);if(!idx.length)return Array(S.count).fill(0);let n=S.count, out=Array(n).fill(0);if(n===2){if(idx.length<2)return out;if(idx[0].v===idx[1].v)return out;out[idx[0].i]=1;out[idx[1].i]=-1;return out}let groups=[];for(let i=0;i<idx.length;){let j=i;while(j<idx.length&&idx[j].v===idx[i].v)j++;groups.push(idx.slice(i,j));i=j}let valsPts=n===3?[1,0,-1]:[2,1,-1,-2];let pos=0;for(const g of groups){let rank=Math.min(pos,valsPts.length-1);let pv=valsPts[rank];g.forEach(x=>out[x.i]=pv);pos+=g.length}return out}

/* ---------- 5-3-1 ---------- */
function pts531(vals){
  if(vals.some(v=>!v||v<=0))return [0,0,0];
  let s=vals.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);
  let out=[0,0,0];
  if(s[0].v===s[2].v){out[0]=out[1]=out[2]=3;return out}
  if(s[0].v===s[1].v){s.forEach(x=>out[x.i]=x.v===s[0].v?4:1);return out}
  if(s[1].v===s[2].v){s.forEach(x=>out[x.i]=x.v===s[2].v?2:5);return out}
  out[s[0].i]=5;out[s[1].i]=3;out[s[2].i]=1;
  return out;
}
function game531(){let totals=[0,0,0];return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${activeHoleIndices().map(h=>{let vals=Array.from({length:3},(_,p)=>Number(getData(['531',h,p],'')));let pts=pts531(vals);pts.forEach((x,p)=>totals[p]+=x);return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td>${Array.from({length:3},(_,p)=>`<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['531',h,p],'')}" oninput="setData(['531',${h},${p}],this.value);liveRefresh(this)"><div class="sub rankPts">${pts[p]}</div></td>`).join('')}</tr>`}).join('')}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div>`}

/* ---------- Stableford ---------- */
function stableGame(){let totals=Array(S.count).fill(0);let hcp=holeHandicap();return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th><th>PAR</th><th>HCP</th>${names().map((n,i)=>`<th>${esc(n)}${isTeam()?`<span class="sub">${teamOf(i)}</span>`:''}</th>`).join('')}</tr></thead><tbody>${activeHoleIndices().map(h=>{let par=S.settings[h][1],hcpv=S.settings[h][2];return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td><td>${par}</td><td>${hcpv}</td>${Array.from({length:S.count},(_,p)=>{let gross=Number(getData(['stable',h,p],''));let alloc=hcp[p][h];let pts=gross?Math.max(0,2+(par+alloc-gross)):0;if(gross)totals[p]+=pts;return `<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['stable',h,p],'')}" oninput="setData(['stable',${h},${p}],this.value);liveRefresh(this)"><span class="hcptxt">${alloc>=0?alloc:0}</span>${gross?`<span class="stablePts">${pts}</span>`:''}</td>`}).join('')}</tr>`}).join('')}<tr><td class="sum">Σ</td><td></td><td></td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div><div class="note" style="margin-top:9px">Vorgaben werden ab HCP 1 lochweise verteilt (schwerste Bahnen zuerst). Score Differentials findest du in der Scorekarte (🏆).</div>${sixesOverlayBlock()}`}
function holeHandicap(){let out=Array.from({length:S.count},()=>Array(18).fill(0));for(let p=0;p<S.count;p++){let strokes=Number(S.stableHcp[p])||0;out[p]=distributeHcpToHoles(strokes);}return out}
function stableTotal(p){let h=holeHandicap()[p],t=0;activeHoleIndices().forEach(i=>{let g=Number(getData(['stable',i,p],''));if(g)t+=Math.max(0,2+(S.settings[i][1]+h[i]-g));});return t}
function stableTotalGross(p){let t=0;activeHoleIndices().forEach(i=>{let g=Number(getData(['stable',i,p],''));if(g)t+=Math.max(0,2+(S.settings[i][1]-g));});return t}

/* ---------- Las Vegas ---------- */
function vegasCompute(){let totals=[0,0];let holeData=[];activeHoleIndices().forEach(h=>{let vals=Array.from({length:4},(_,p)=>Number(getData(['vegas',h,p],'')));let a=vals.slice(0,2).every(Boolean)?`${Math.min(vals[0],vals[1])}${Math.max(vals[0],vals[1])}`:'';let b=vals.slice(2,4).every(Boolean)?`${Math.min(vals[2],vals[3])}${Math.max(vals[2],vals[3])}`:'';let birdA=getData(['vegas',h,'birdA'],false),birdB=getData(['vegas',h,'birdB'],false);let shownA=a,shownB=b;if(birdB&&a)shownA=`${a[1]}${a[0]}`;if(birdA&&b)shownB=`${b[1]}${b[0]}`;if(a)totals[0]+=Number(shownA);if(b)totals[1]+=Number(shownB);holeData.push({h,vals,shownA,shownB,birdA,birdB});});return {totals,holeData}}
function vegasGame(){let {totals,holeData}=vegasCompute();return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map((n,i)=>`<th class="teamHead">${esc(n)}<span class="sub">Team ${i<2?'A':'B'}</span></th>`).join('')}<th>Teams</th></tr></thead><tbody>${holeData.map((info)=>{let {h,vals,shownA,shownB,birdA,birdB}=info;return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td>${vals.map((v,p)=>`<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['vegas',h,p],'')}" oninput="setData(['vegas',${h},${p}],this.value);liveRefresh(this)"></td>`).join('')}<td><div class="pill">A ${shownA||'—'}</div><div class="pill">B ${shownB||'—'}</div><label class="sub" style="display:block;margin-top:5px;text-align:left"><input type="checkbox" ${birdA?'checked':''} onchange="setData(['vegas',${h},'birdA'],this.checked);render()"> Birdie Team A</label><label class="sub" style="display:block;margin-top:3px;text-align:left"><input type="checkbox" ${birdB?'checked':''} onchange="setData(['vegas',${h},'birdB'],this.checked);render()"> Birdie Team B</label></td></tr>`}).join('')}<tr><td class="sum">Σ</td><td colspan="2" class="sum">Team A ${totals[0]}</td><td colspan="2" class="sum">Team B ${totals[1]}</td><td></td></tr></tbody></table></div>`}

/* ---------- Bingo Bango Bongo ---------- */
function bbbGame(){let totals=Array(S.count).fill(0);return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${activeHoleIndices().map(h=>{let awards=['bingo','bango','bongo'];let cur=h===currentHoleIndex()?'curHole':'';return `<tr class="${cur}"><td class="hole">${holeCell(h)}</td>${Array.from({length:S.count},(_,p)=>{let pts=awards.reduce((a,k)=>a+(getData(['bbb',h,k],-1)==p?1:0),0);totals[p]+=pts;return `<td class="points">${pts}</td>`}).join('')}</tr><tr class="${cur}"><td class="hole">↳</td><td colspan="${S.count}">${awards.map((k,i)=>`<label class="sub" style="display:block;text-align:left;margin:4px 0">${['Bingo – erster auf dem Grün','Bango – nearest to the pin (alle auf Grün)','Bongo – erster im Loch'][i]} <select class="select" onchange="setData(['bbb',${h},'${k}'],Number(this.value));save();updateScorebar()"><option value="-1">—</option>${names().map((n,p)=>`<option value="${p}" ${getData(['bbb',h,k],-1)==p?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`).join('')}</td></tr>`}).join('')}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div>`}

/* ---------- Skins ---------- */
function skinsCompute(){let totals=Array(S.count).fill(0);let carry=1;let holeInfo=[];let wins=Array.from({length:S.count},()=>[]);activeHoleIndices().forEach(h=>{let vals=Array.from({length:S.count},(_,p)=>Number(getData(['skins',h,p],'')));let complete=vals.every(v=>v>0);if(complete){let best=Math.min(...vals);let winners=vals.map((v,p)=>v===best?p:null).filter(p=>p!==null);if(winners.length===1){totals[winners[0]]+=carry;wins[winners[0]].push({hole:h+1,skins:carry});carry=1}else carry++;}holeInfo.push({h,vals});});return {totals,carry,holeInfo,wins}}
function skinsGame(){let {totals,carry,holeInfo,wins}=skinsCompute();let rows=holeInfo.map(({h,vals})=>`<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td>${vals.map((v,p)=>`<td><input class="compact" type="number" inputmode="numeric" min="0" max="99" value="${getData(['skins',h,p],'')}" oninput="setData(['skins',${h},${p}],this.value);liveRefresh(this)"></td>`).join('')}</tr>`).join('');return `<div class="note">Ein Skin geht an den alleinigen Lochgewinner. Bei Gleichstand wandert er weiter; der nächste alleinige Gewinner erhält die aufgelaufenen Skins. Aktueller Carry: <b>${carry}</b>.</div><div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${rows}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div><div class="miniGrid" style="margin-top:9px">${names().map((n,p)=>`<div class="settingCard"><b>${esc(n)}</b><div class="sub">${wins[p].length?wins[p].map(w=>`Loch ${w.hole}${w.skins>1?` (+${w.skins})`:''}`).join(', '):'noch keine Skins'}</div></div>`).join('')}</div>`}

/* ---------- Nassau ---------- */
function nassauCompute(){let front=Array(S.count).fill(0),back=Array(S.count).fill(0),all=Array(S.count).fill(0);activeHoleIndices().forEach(h=>{let vals=Array.from({length:S.count},(_,p)=>Number(getData(['nassau',h,p],'')));for(let p=0;p<S.count;p++){if(vals[p]>0){all[p]+=vals[p];if(h<9)front[p]+=vals[p];else back[p]+=vals[p]}}});return {front,back,all}}
function nassauLeaderLabel(arr){let entries=names().map((n,p)=>[n,arr[p]]).filter(x=>x[1]>0);if(!entries.length)return '—';let min=Math.min(...entries.map(x=>x[1]));let leaders=entries.filter(x=>x[1]===min);if(leaders.length>1)return 'Gleichstand';return `${leaders[0][0]} (${leaders[0][1]})`}
function nassauGame(){let {front,back,all}=nassauCompute();return `<div class="note">Nassau wird als drei Schlagzahl-Wertungen geführt: Front 9, Back 9 und Gesamt 18. Bei Gleichstand gibt es keinen alleinigen Sieger.</div><div class="miniGrid" style="margin-bottom:9px"><div class="settingCard"><label>Front 9 Zwischenstand</label><b>${esc(nassauLeaderLabel(front))}</b></div><div class="settingCard"><label>Back 9 Zwischenstand</label><b>${esc(nassauLeaderLabel(back))}</b></div><div class="settingCard"><label>Gesamt Zwischenstand</label><b>${esc(nassauLeaderLabel(all))}</b></div></div><div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${activeHoleIndices().map(h=>`<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td>${Array.from({length:S.count},(_,p)=>`<td><input class="compact" type="number" inputmode="numeric" min="0" max="99" value="${getData(['nassau',h,p],'')}" oninput="setData(['nassau',${h},${p}],this.value);liveRefresh(this)"></td>`).join('')}</tr>`).join('')}<tr><td class="sum">Σ</td>${all.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div><div class="miniGrid" style="margin-top:9px">${names().map((n,p)=>`<div class="settingCard"><b>${esc(n)}</b><div class="sub">Front 9 · ${front[p]}</div><div class="sub">Back 9 · ${back[p]}</div><div class="points">Gesamt · ${all[p]}</div></div>`).join('')}</div>`}

/* ---------- Scramble / Fourball / Bridesmaid (frei zuordenbare Teams) ---------- */
function scrambleGame(){
  let hcpA=S.teamFormatHcp?teamCombinedHcp('scramble','A'):0;
  let hcpB=S.teamFormatHcp?teamCombinedHcp('scramble','B'):0;
  let allocA=distributeHcpToHoles(hcpA),allocB=distributeHcpToHoles(hcpB);
  let totA=0,totB=0;
  let rows=activeHoleIndices().map(h=>{
    let a=Number(getData(['scramble',h,0],'')),b=Number(getData(['scramble',h,1],''));
    if(a)totA+=a; if(b)totB+=b;
    return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td>
    <td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['scramble',h,0],'')}" oninput="setData(['scramble',${h},0],this.value);liveRefresh(this)">${S.teamFormatHcp&&allocA[h]?`<span class="hcptxt">+${allocA[h]}</span>`:''}</td>
    <td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['scramble',h,1],'')}" oninput="setData(['scramble',${h},1],this.value);liveRefresh(this)">${S.teamFormatHcp&&allocB[h]?`<span class="hcptxt">+${allocB[h]}</span>`:''}</td></tr>`;
  }).join('');

  <div class="card"><table class="table"><thead><tr><th class="hole">Loch</th><th class="teamHead">Team A</th><th class="teamHead">Team B</th></tr></thead><tbody>${rows}
  <tr><td class="sum">Σ Brutto</td><td class="sum">${totA}</td><td class="sum">${totB}</td></tr>
  ${S.teamFormatHcp?`<tr><td class="sum">Σ Netto</td><td class="sum">${netA}</td><td class="sum">${netB}</td></tr>`:''}
  </tbody></table></div>`;
}
function bestBallCore(mode,h,members,factorKey){
  let f=loadTeamHcp();
  let vals=members.map(p=>Number(getData([mode,h,p],''))||0);
  let allocs=members.map(p=>{
    let hcp=S.teamFormatHcp?Math.round((Number(S.stableHcp[p])||0)*f[factorKey]):0;
    return distributeHcpToHoles(hcp)[h];
  });
  let nets=vals.map((v,i)=>v?v-allocs[i]:null);
  return {vals,allocs,nets};
}
function fourballGame(){
  let memA=teamMembers('A'),memB=teamMembers('B');
  let totA=0,totB=0;
  let rows=activeHoleIndices().map(h=>{
    let a=bestBallCore('fourball',h,memA,'fb'), b=bestBallCore('fourball',h,memB,'fb');
    let bestA=a.nets.every(n=>n===null)?null:Math.min(...a.nets.filter(n=>n!==null));
    let bestB=b.nets.every(n=>n===null)?null:Math.min(...b.nets.filter(n=>n!==null));
    if(bestA!=null)totA+=bestA; if(bestB!=null)totB+=bestB;
    let allMem=[...memA,...memB];
    return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td>
    ${allMem.map(p=>{let inA=memA.includes(p);let idx=(inA?memA:memB).indexOf(p);let alloc=(inA?a.allocs:b.allocs)[idx];return `<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['fourball',h,p],'')}" oninput="setData(['fourball',${h},${p}],this.value);liveRefresh(this)"><span class="hcptxt">${alloc?('+'+alloc):''}</span></td>`;}).join('')}
    <td class="tiny">${bestA!=null?bestA:'—'} / ${bestB!=null?bestB:'—'}</td></tr>`;
  }).join('');
  let allMem=[...memA,...memB];
  return `<div class="note">Team A best Netto vs Team B best Netto je Loch. Jeder Spieler behält seine eigene Vorgabe (Bestball-Regel). ${S.teamFormatHcp?`Vorgabe-Anteil ${Math.round(loadTeamHcp().fb*100)}% je Spieler, lochweise an den schwersten Bahnen verteilt.`:'Ohne Vorgabe – Bruttowertung.'}</div>
  <div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${allMem.map(p=>`<th>${esc(playerName(p))}<span class="sub">${teamOf(p)}</span></th>`).join('')}<th>Beste</th></tr></thead><tbody>${rows}
  <tr><td class="sum">Σ</td><td colspan="${memA.length}" class="sum">A ${totA}</td><td colspan="${memB.length}" class="sum">B ${totB}</td></tr>
  </tbody></table></div>${sixesOverlayBlock()}`;
}
function bridesmaidGame(){
  let memA=teamMembers('A'),memB=teamMembers('B');
  let totA=0,totB=0;
  let rows=activeHoleIndices().map(h=>{
    let a=bestBallCore('bridesmaid',h,memA,'bm'), b=bestBallCore('bridesmaid',h,memB,'bm');
    let worstA=a.nets.every(n=>n===null)?null:Math.max(...a.nets.filter(n=>n!==null));
    let worstB=b.nets.every(n=>n===null)?null:Math.max(...b.nets.filter(n=>n!==null));
    if(worstA!=null)totA+=worstA; if(worstB!=null)totB+=worstB;
    let allMem=[...memA,...memB];
    return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td>
    ${allMem.map(p=>{let inA=memA.includes(p);let idx=(inA?memA:memB).indexOf(p);let alloc=(inA?a.allocs:b.allocs)[idx];return `<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['bridesmaid',h,p],'')}" oninput="setData(['bridesmaid',${h},${p}],this.value);liveRefresh(this)"><span class="hcptxt">${alloc?('+'+alloc):''}</span></td>`;}).join('')}
    <td class="tiny">${worstA!=null?worstA:'—'} / ${worstB!=null?worstB:'—'}</td></tr>`;
  }).join('');
  let allMem=[...memA,...memB];
  return `<div class="note">Bridesmaid: Team A schlechteres Netto vs Team B schlechteres Netto je Loch. Jeder Spieler behält seine eigene Vorgabe (Bestball-Regel). ${S.teamFormatHcp?`Vorgabe-Anteil ${Math.round(loadTeamHcp().bm*100)}% je Spieler, lochweise an den schwersten Bahnen verteilt.`:'Ohne Vorgabe – Bruttowertung.'}</div>
  <div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${allMem.map(p=>`<th>${esc(playerName(p))}<span class="sub">${teamOf(p)}</span></th>`).join('')}<th>Schlechtere</th></tr></thead><tbody>${rows}
  <tr><td class="sum">Σ</td><td colspan="${memA.length}" class="sum">A ${totA}</td><td colspan="${memB.length}" class="sum">B ${totB}</td></tr>
  </tbody></table></div>`;
}

/* ---------- Chapman / Foursome / Greensome (gemeinsame Funktion, mit Sixes) ---------- */

    <td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData([mode,h,1],'')}" oninput="setData(['${mode}',${h},1],this.value);liveRefresh(this)">${S.teamFormatHcp&&allocB[h]?`<span class="hcptxt">+${allocB[h]}</span>`:''}</td></tr>`;

function sixesTeamSingleGame(mode){

/* ---------- String Golf ---------- */
function stringGame(){
  let totals=Array(S.count).fill(0);
  let rows=activeHoleIndices().map(h=>{
    return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${holeCell(h)}</td>${Array.from({length:S.count},(_,p)=>{
      let g=Number(getData(['string',h,p],''));
      let cmHere=Number(getData(['stringCm',h,p],0))||0;
      let net=g?(g-(cmHere>0?1:0)):0;
      if(g)totals[p]+=net;
      let maxAllowed=stringRemainingCm(p)+cmHere;
      return `<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['string',h,p],'')}" oninput="setData(['string',${h},${p}],this.value);liveRefresh(this)">
      <input class="compact" style="margin-top:4px" inputmode="numeric" type="number" min="0" max="${maxAllowed}" placeholder="cm" value="${cmHere||''}" onchange="setStringCm(${h},${p},this.value)">
      <span class="sub">${g?net:''}</span></td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<div class="note">Virtuelle Schnur (Rest): ${names().map((n,p)=>`${esc(n)} ${stringRemainingCm(p)} cm`).join(' · ')}${stringIsTeam()?' · Team-Budget aus dem Mittelwert beider Vorgaben, gemeinsam genutzt':''}. Trag nach jeder Bahn im zweiten Feld zentimetergenau ein, wie viel Schnur du einlöst – jede Bahn mit &gt;0 cm spart 1 Schlag, der Rest wird exakt von der Schnur abgezogen.</div>
  <div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${rows}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t||0}</td>`).join('')}</tr></tbody></table></div>`;
}

/* ---------- Erweiterte Scorekarte / Score Differential (immer für 9 & 18 Loch) ---------- */
const SCORECARD_MODES=['count','stable','string','nassau','skins','scramble','chapman','foursome','greensome','fourball','bridesmaid'];
function modeHasScorecard(){return !sixesActiveForMode()&&SCORECARD_MODES.includes(S.mode);}
function courseParTotal(){return S.settings.reduce((a,r)=>a+r[1],0);}
function courseParHalf(startIdx,endIdx){return S.settings.slice(startIdx,endIdx+1).reduce((a,r)=>a+r[1],0);}
function courseSlopeRating(gender){
  let isW=gender==='w';
  let par=courseParTotal();
  return {slope:Number(isW?S.courseSlopeW:S.courseSlopeM)||113, rating:(()=>{let r=isW?S.courseRatingW:S.courseRatingM;return (r===undefined||r===null||r==='')?par:Number(r);})()};
}
function scoreDifferential(grossTotal,scope,gender){
  let {slope,rating}=courseSlopeRating(gender);
  let par=courseParTotal();
  let ratingPortion=rating;
  if(scope==='front')ratingPortion=rating*(courseParHalf(0,8)/par);
  else if(scope==='back')ratingPortion=rating*(courseParHalf(9,17)/par);
  let diff=(113/slope)*(grossTotal-ratingPortion);
  return Math.round(diff*10)/10;
}
function nineHoleCalculatedSD(hcpIndex){return ((Number(hcpIndex)||0)*1.04+2.4)/2;}
function diffLabel(d,approx){if(d===undefined||d===null||isNaN(d))return '–';return (approx?'~':'')+(d>=0?'+':'')+d.toFixed(1);}
function scorecardUnits(){
  if(['chapman','foursome','greensome','scramble'].includes(S.mode)){
    return [{key:0,label:'Team A',isTeam:true,members:teamMembers('A')},{key:1,label:'Team B',isTeam:true,members:teamMembers('B')}];
  }
  if(['fourball','bridesmaid'].includes(S.mode)){
    return [{key:'A',label:'Team A',isTeam:true,members:teamMembers('A')},{key:'B',label:'Team B',isTeam:true,members:teamMembers('B')}];
  }
  if(isTeam()&&(S.mode==='count'||S.mode==='stable')){
    return [{key:'A',label:'Team A',isTeam:true,members:teamMembers('A')},{key:'B',label:'Team B',isTeam:true,members:teamMembers('B')}];
  }
  if(['count','stable','string','nassau','skins'].includes(S.mode)){
    return Array.from({length:S.count},(_,p)=>({key:p,label:playerName(p),isTeam:false,members:[p]}));
  }
  return [];
}
function scorecardHoleGross(unit,h){
  const m=S.mode;
  if(['chapman','foursome','greensome','scramble'].includes(m))return Number(getData([m,h,unit.key],''))||0;
  if(m==='fourball'||m==='bridesmaid'){
    let core=bestBallCore(m,h,unit.members,m==='fourball'?'fb':'bm');
    let valid=core.nets.map((n,i)=>({n,i})).filter(x=>x.n!==null);
    if(!valid.length)return 0;
    let pick=m==='fourball'?valid.reduce((a,b)=>a.n<=b.n?a:b):valid.reduce((a,b)=>a.n>=b.n?a:b);
    return core.vals[pick.i]||0;
  }
  if(unit.isTeam){
    let sum=0,any=false;
    unit.members.forEach(p=>{let g=Number(getData([m,h,p],''))||0;if(g){sum+=g;any=true;}});
    return any?sum:0;
  }
  return Number(getData([m,h,unit.key],''))||0;
}
function scorecardHoleAlloc(unit,h){
  const m=S.mode;
  if(['chapman','foursome','greensome','scramble'].includes(m)){
    if(!S.teamFormatHcp)return 0;
    let letter=unit.key===0?'A':'B';
    let hcpTotal=teamCombinedHcp(m,letter);
    return distributeHcpToHoles(hcpTotal)[h];
  }
  if(m==='fourball'||m==='bridesmaid'){
    let core=bestBallCore(m,h,unit.members,m==='fourball'?'fb':'bm');
    let valid=core.nets.map((n,i)=>({n,i})).filter(x=>x.n!==null);
    if(!valid.length)return 0;
    let pick=m==='fourball'?valid.reduce((a,b)=>a.n<=b.n?a:b):valid.reduce((a,b)=>a.n>=b.n?a:b);
    return core.allocs[pick.i]||0;
  }
  if((m==='count'||m==='stable')){
    if(unit.isTeam)return unit.members.reduce((a,p)=>a+playerHoleAlloc(p,h),0);
    return playerHoleAlloc(unit.key,h);
  }
  return 0;
}
function halfStats(unit,startIdx,endIdx){
  let gross=0,net=0,played=0,grossPtsStable=0;
  for(let h=startIdx;h<=endIdx;h++){
    let g=scorecardHoleGross(unit,h);
    if(g>0){
      played++;gross+=g;
      if(S.mode==='stable'){
        let par=S.settings[h][1];let alloc=scorecardHoleAlloc(unit,h);
        net+=Math.max(0,2+(par+alloc-g));
        grossPtsStable+=Math.max(0,2+(par-g));
      } else if(S.mode==='string'){
        let cm=Number(getData(['stringCm',h,unit.key],0))||0;
        net+=g-(cm>0?1:0);
      } else {
        net+=g-scorecardHoleAlloc(unit,h);
      }
    }
  }
  return {gross,net,played,grossPtsStable};
}
function unitHcpIndexForSD(unit){
  if(!unit.isTeam)return S.playerHcpIndex[unit.key]||0;
  let mem=unit.members;if(!mem.length)return 0;
  return mem.reduce((a,p)=>a+(Number(S.playerHcpIndex[p])||0),0)/mem.length;
}
function unitGenderForSD(unit){return unit.isTeam?'m':(S.playerGender[unit.key]||'m');}
function scorecardTotalsV2(unit){
  let front=halfStats(unit,0,8);
  let back=halfStats(unit,9,17);
  let full={gross:front.gross+back.gross,net:front.net+back.net,played:front.played+back.played,grossPtsStable:front.grossPtsStable+back.grossPtsStable};
  return {front,back,full};
}
function halfDifferential(unit,stats,scope){
  if(stats.played!==9)return null;
  let sdPlayed=scoreDifferential(stats.gross,scope,unitGenderForSD(unit));
  let sdCalc=nineHoleCalculatedSD(unitHcpIndexForSD(unit));
  return Math.round((sdPlayed+sdCalc)*10)/10;
}
function fullDifferential(unit,stats){
  if(stats.played!==18)return null;
  return scoreDifferential(stats.gross,'all',unitGenderForSD(unit));
}
function netLabelFor(t){return S.mode==='stable'?` · Netto-Pkt ${t.net} · Brutto-Pkt ${t.grossPtsStable}`:` · Netto ${t.net}`;}
function renderUnitScorecardBlock(unit){
  let t=scorecardTotalsV2(unit);
  let lines=[];
  if(t.front.played>0){
    let sd=halfDifferential(unit,t.front,'front');
    lines.push(`<div class="sub">Front 9 (${t.front.played}/9): Brutto ${t.front.gross}${netLabelFor(t.front)}${sd!==null?` · SD ${diffLabel(sd,true)}`:''}</div>`);
  }
  if(t.back.played>0){
    let sd=halfDifferential(unit,t.back,'back');
    lines.push(`<div class="sub">Back 9 (${t.back.played}/9): Brutto ${t.back.gross}${netLabelFor(t.back)}${sd!==null?` · SD ${diffLabel(sd,true)}`:''}</div>`);
  }
  let full18='';
  if(t.full.played===18){
    let sd=fullDifferential(unit,t.full);
    full18=`<div class="settingCard" style="margin-top:6px;border-color:#68c487"><b>Gesamt 18 Loch</b><div class="sub">Brutto ${t.full.gross}${netLabelFor(t.full)}${sd!==null?` · SD ${diffLabel(sd,false)}`:''}</div></div>`;
  }
  return `<div class="settingCard" style="margin:6px 0"><b>${esc(unit.label)}</b>${lines.join('')}${full18}</div>`;
}
function strokeScorecardHtml(){
  let units=scorecardUnits();
  if(!units.length)return '';
  return `<div class="section"><div class="label">Erweiterte Scorekarte</div>${units.map(renderUnitScorecardBlock).join('')}<div class="hint">„~" kennzeichnet ein auf 18 Löcher hochgerechnetes Score Differential nach der offiziellen DGV-Formel (Stand 04/2024): SD(18) = SD(9 gespielt) + ((HCPI × 1,04) + 2,4) / 2. Das 9-Loch-Rating wird dabei näherungsweise anteilig aus dem 18-Loch Course Rating anhand des PARs abgeleitet.</div></div>`;
}
function matchHoleHistory(){
  let out=[];let diff=0;
  let useHcp=S.matchHcp&&S.count===2;
  let allocA=[],allocB=[];
  if(useHcp){let r=matchHcpAlloc();allocA=r.allocA;allocB=r.allocB;}
  activeHoleIndices().forEach(h=>{
    let holeDiff=null;
    if(useHcp){
      let gA=Number(getData(['matchhcp',h,0],'')), gB=Number(getData(['matchhcp',h,1],''));
      if(gA&&gB){let nA=gA-allocA[h],nB=gB-allocB[h];holeDiff=nA<nB?1:(nB<nA?-1:0);}
    } else {
      let v=getData(['match',h],null);
      if(v!==null&&v!==undefined)holeDiff=v;
    }
    if(holeDiff===null)return;
    diff+=holeDiff;
    out.push({hole:h+1,diff});
  });
  return out;
}
function matchNames(){
  if(S.matchHcp&&S.count===2)return [playerName(0),playerName(1)];
  return [isTeam()?'Team A':playerName(0), isTeam()?'Team B':playerName(1)];
}
function matchFinalLabel(hist){
  let [aName,bName]=matchNames();
  if(!hist.length)return 'Noch keine Ergebnisse eingetragen.';
  let clinched=hist.find(x=>Math.abs(x.diff)>(18-x.hole));
  if(clinched)return `${esc(clinched.diff>0?aName:bName)} gewinnt ${Math.abs(clinched.diff)}&${18-clinched.hole} (entschieden nach Loch ${clinched.hole})`;
  let last=hist[hist.length-1];
  if(last.hole===18){
    if(last.diff===0)return 'Unentschieden (All Square nach 18 Löchern)';
    return `${esc(last.diff>0?aName:bName)} gewinnt ${Math.abs(last.diff)} Up`;
  }
  if(last.diff===0)return 'Aktuell All Square';
  return `Aktuell ${esc(last.diff>0?aName:bName)} ${Math.abs(last.diff)} Up (nach Loch ${last.hole})`;
}
function matchScorecardHtml(){
  let hist=matchHoleHistory();
  let [aName,bName]=matchNames();
  if(!hist.length)return `<div class="section"><div class="note">Noch keine Ergebnisse eingetragen.</div></div>`;
  let rows=hist.map(x=>{let st=matchStatus(x.diff,18-x.hole);return `<tr><td class="hole">${x.hole}</td><td class="tiny">${esc(st.a)}</td><td class="tiny">${esc(st.b)}</td></tr>`;}).join('');
  return `<div class="section"><div class="label">Matchplay-Verlauf</div><div class="note">${matchFinalLabel(hist)}</div><div class="card"><table class="table"><thead><tr><th class="hole">Loch</th><th>${esc(aName)}</th><th>${esc(bName)}</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function segmentHistoryHtml(){
  if(!S.segments||!S.segments.length)return '';
  let cards=S.segments.map((seg,i)=>{
    let teamTxt=seg.teamInfo?`<div class="sub">Team A: ${esc(seg.teamInfo.A.join(', ')||'–')} · Team B: ${esc(seg.teamInfo.B.join(', ')||'–')}</div>`:'';
    let standingsTxt=(seg.standings||[]).map((x,i2)=>`<div class="sub">${i2+1}. ${esc(x[0])}: ${x[1]}</div>`).join('');
    return `<div class="settingCard" style="margin:6px 0"><b>Abschnitt ${i+1}: Löcher ${seg.fromHole}–${seg.toHole} · ${esc(seg.modeLabel)}</b>${teamTxt}${standingsTxt}</div>`;
  }).join('');
  return `<div class="section"><div class="label">Rundenverlauf (Modus-/Team-Wechsel)</div>${cards}</div>`;
}

/* ---------- Scoreboard / Verlauf ---------- */
function scoreFor(p){
  if(sixesActiveForMode())return sixesPlayerPoints(p);
  if(S.mode==='count')return activeHoleIndices().reduce((a,h)=>a+(Number(getData(['count',h,p],0))||0),0);
  if(S.mode==='match'){
    if(S.matchHcp&&S.count===2){let diff=matchDiffHcp();return p===0?diff:-diff;}
    let diff=activeHoleIndices().reduce((a,h)=>a+(Number(getData(['match',h],0))||0),0);
    if(isTeam())return teamOf(p)==='A'?diff:-diff;
    return p===0?diff:-diff;
  }
  if(S.mode==='short')return activeHoleIndices().reduce((a,h)=>a+(Number(getData(['short',h,p],''))||0),0);
  if(S.mode==='fun')return activeHoleIndices().reduce((a,h)=>a+funPointsForHole(h)[p]+bonusFor(h,p),0);
  if(S.mode==='stable'){
    if(isTeam()){let mem=teamMembers(teamOf(p));return mem.reduce((a,q)=>a+stableTotal(q),0);}
    return stableTotal(p);
  }
  if(S.mode==='bbb')return activeHoleIndices().reduce((a,h)=>a+['bingo','bango','bongo'].reduce((s,k)=>s+(getData(['bbb',h,k],-1)==p?1:0),0),0);
  if(S.mode==='wolf')return activeHoleIndices().reduce((a,h)=>a+wolfPoints(S.count,h%S.count,getData(['wolf',h,'pick'],''),getData(['wolf',h,'result'],'geteilt'))[p],0);
  if(S.mode==='531')return activeHoleIndices().reduce((a,h)=>a+pts531(Array.from({length:3},(_,q)=>Number(getData(['531',h,q],''))))[p],0);
  if(S.mode==='vegas'){let {totals}=vegasCompute();return p<2?totals[0]:totals[1];}
  if(S.mode==='skins')return skinsCompute().totals[p];
  if(S.mode==='nassau')return nassauCompute().all[p];
  if(S.mode==='string')return activeHoleIndices().reduce((a,h)=>{let g=Number(getData(['string',h,p],''));if(!g)return a;let cm=Number(getData(['stringCm',h,p],0))||0;return a+(g-(cm>0?1:0));},0);
  if(S.mode==='scramble'){
    let letter=teamOf(p);let hcpTotal=S.teamFormatHcp?teamCombinedHcp('scramble',letter):0;let alloc=distributeHcpToHoles(hcpTotal);
    let slot=letter==='A'?0:1;let tot=activeHoleIndices().reduce((a,h)=>a+(Number(getData(['scramble',h,slot],0))||0),0);
    return tot-hcpTotal;
  }
  if(S.mode==='chapman'||S.mode==='foursome'||S.mode==='greensome'){
    let letter=teamOf(p);let hcpTotal=S.teamFormatHcp?teamCombinedHcp(S.mode,letter):0;
    let slot=letter==='A'?0:1;let tot=activeHoleIndices().reduce((a,h)=>a+(Number(getData([S.mode,h,slot],0))||0),0);
    return tot-hcpTotal;
  }
  if(S.mode==='fourball'||S.mode==='bridesmaid'){
    let letter=teamOf(p);let mem=teamMembers(letter);
    let total=0;
    activeHoleIndices().forEach(h=>{
      let core=bestBallCore(S.mode,h,mem,S.mode==='fourball'?'fb':'bm');
      let valid=core.nets.filter(n=>n!==null);
      if(!valid.length)return;
      total+= S.mode==='fourball'?Math.min(...valid):Math.max(...valid);
    });
    return total;
  }
  return 0;
}
function computeStandings(){
  let asc=LOWER_BETTER.includes(S.mode)&&!sixesActiveForMode();
  if(isTeam()){
    let sumBased=['count','fun','string'].includes(S.mode);
    let sums;
    if(sumBased){
      sums=[teamMembers('A').reduce((a,p)=>a+scoreFor(p),0), teamMembers('B').reduce((a,p)=>a+scoreFor(p),0)];
    } else {
      let repA=teamMembers('A')[0],repB=teamMembers('B')[0];
      sums=[repA!==undefined?scoreFor(repA):0, repB!==undefined?scoreFor(repB):0];
    }
    let arr=[['Team A',sums[0]],['Team B',sums[1]]];
    return asc?arr.sort((a,b)=>a[1]-b[1]):arr.sort((a,b)=>b[1]-a[1]);
  }
  let arr=names().map((n,p)=>[n,scoreFor(p)]);
  return asc?arr.sort((a,b)=>a[1]-b[1]):arr.sort((a,b)=>b[1]-a[1]);
}
function scorecardShareTitle(){return 'Scorekarte - '+modeLabel();}
function scoreboard(){
  let arr=computeStandings();
  let extra='';
  if(S.mode==='match')extra=matchScorecardHtml();
  else if(modeHasScorecard())extra=strokeScorecardHtml();
  showModal(`<h2>🏆 ${esc(scorecardShareTitle())}</h2><p>Aktueller Überblick · ${modeLabel()} · ${esc(S.courseName||'Varus')}</p>${arr.map((x,i)=>`<div class="settingCard" style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><b>${i+1}. ${esc(x[0])}</b><span class="points">${x[1]}</span></div>`).join('')}${extra}${segmentHistoryHtml()}<div class="section"><button class="secondary" onclick="shareRound()">📤 Ergebnis teilen</button></div><div class="section"><button class="secondary" onclick="exportScorecardImage()">🖼️ Scorekarte vergrößern &amp; exportieren</button></div><div class="section"><button class="secondary" onclick="finishRoundConfirm()">🏁 Runde abschließen &amp; speichern</button></div><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`)}
function buildShareText(){
  let arr=computeStandings();
  let lines=[`⛳ ${scorecardShareTitle()}`,`Platz: ${S.courseName||'Varus'}`,''];
  arr.forEach((x,i)=>lines.push(`${i+1}. ${x[0]}: ${x[1]}`));
  if(S.mode==='match'){
    let hist=matchHoleHistory();
    if(hist.length){
      let [aName,bName]=matchNames();
      lines.push('',`Ergebnis: ${matchFinalLabel(hist)}`,'','Verlauf:');
      hist.forEach(x=>{let st=matchStatus(x.diff,18-x.hole);lines.push(`Loch ${x.hole}: ${aName} ${st.a} · ${bName} ${st.b}`);});
    }
  } else if(modeHasScorecard()){
    lines.push('','Scorekarte:');
    scorecardUnits().forEach(u=>{
      let t=scorecardTotalsV2(u);
      let parts=[];
      if(t.front.played>0){let sd=halfDifferential(u,t.front,'front');parts.push(`Front9 Brutto ${t.front.gross}${netLabelFor(t.front)}${sd!==null?` SD ${diffLabel(sd,true)}`:''}`);}
      if(t.back.played>0){let sd=halfDifferential(u,t.back,'back');parts.push(`Back9 Brutto ${t.back.gross}${netLabelFor(t.back)}${sd!==null?` SD ${diffLabel(sd,true)}`:''}`);}
      if(t.full.played===18){let sd=fullDifferential(u,t.full);parts.push(`Gesamt Brutto ${t.full.gross}${netLabelFor(t.full)}${sd!==null?` SD ${diffLabel(sd,false)}`:''}`);}
      lines.push(`${u.label}: ${parts.join(' · ')}`);
    });
  }
  if(S.segments&&S.segments.length){
    lines.push('','Rundenverlauf:');
    S.segments.forEach((seg,i)=>{
      lines.push(`Abschnitt ${i+1} (Löcher ${seg.fromHole}-${seg.toHole}): ${seg.modeLabel}${seg.teamInfo?` · A:${seg.teamInfo.A.join('+')} B:${seg.teamInfo.B.join('+')}`:''}`);
    });
  }
  return lines.join('\n');
}
function shareRound(){let text=buildShareText();let title=scorecardShareTitle();if(navigator.share){navigator.share({title,text}).catch(()=>{})}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showModal(`<h2>Kopiert</h2><p>Das Ergebnis wurde in die Zwischenablage kopiert.</p><div class="modalActions"><button class="close" onclick="closeModal()">OK</button></div>`)).catch(()=>showModal(`<h2>${esc(title)}</h2><p style="white-space:pre-wrap">${esc(text)}</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`))}else{showModal(`<h2>${esc(title)}</h2><p style="white-space:pre-wrap">${esc(text)}</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`)}}

/* ---------- Bild-/PDF-Export mit Zoom-Vorschau ---------- */
const EXPORT_SCALE=2;
function finalizeCanvasExport(canvas,filename,shareTitle){
  canvas.toBlob(blob=>{
    if(!blob)return;
    let file=new File([blob],filename,{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:shareTitle||scorecardShareTitle()}).catch(()=>{});
    } else {
      let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    }
  },'image/png');
}
function openImageZoom(canvas){
  closeImageZoom();
  let dataUrl=canvas.toDataURL('image/png');
  let overlay=document.createElement('div');
  overlay.className='zoomOverlay';
  overlay.id='zoomOverlay';
  overlay.onclick=function(e){if(e.target===overlay)closeImageZoom();};
  let img=document.createElement('img');img.src=dataUrl;
  overlay.appendChild(img);
  let bar=document.createElement('div');
  bar.style.cssText='position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;z-index:82';
  let shareBtn=document.createElement('button');shareBtn.className='iconBtn';shareBtn.style.width='auto';shareBtn.style.padding='0 16px';shareBtn.textContent='📤 Teilen';
  shareBtn.onclick=function(){finalizeCanvasExport(canvas,exportFilename('png'),scorecardShareTitle());};
  let pdfBtn=document.createElement('button');pdfBtn.className='iconBtn';pdfBtn.style.width='auto';pdfBtn.style.padding='0 16px';pdfBtn.textContent='📄 PDF';
  pdfBtn.onclick=function(){exportCanvasAsPDF(canvas);};
  bar.appendChild(shareBtn);bar.appendChild(pdfBtn);
  let closeBtn=document.createElement('button');closeBtn.className='zoomClose';closeBtn.textContent='✕';closeBtn.onclick=closeImageZoom;
  document.body.appendChild(overlay);
  document.body.appendChild(bar);
  document.body.appendChild(closeBtn);
  window._zoomOverlay=overlay;window._zoomBar=bar;window._zoomCloseBtn=closeBtn;
}
function closeImageZoom(){
  if(window._zoomOverlay)window._zoomOverlay.remove();
  if(window._zoomBar)window._zoomBar.remove();

function buildStrokeScorecardCanvas(){

  ctx.font='13px sans-serif';ctx.fillStyle='#9eaa9f';ctx.fillText((S.courseName||'Varus')+' · '+new Date().toLocaleDateString('de-DE'),marginX,52);
  let widths=[labelW,...Array(18).fill(colW),sumW,sumW,sumW];
  let y=headerH;
  function row(cells,opts={}){
    let x=marginX;ctx.font=opts.font||'12px sans-serif';ctx.fillStyle=opts.color||'#dbe6dc';
    cells.forEach((c,i)=>{ctx.textAlign=i===0?'left':'center';let cw=widths[i];ctx.fillText(String(c),i===0?x:x+cw/2,y);x+=cw;});
    y+=rowH;
  }
  row(['Loch',...Array.from({length:18},(_,i)=>i+1),'OUT','IN','TOT'],{font:'bold 12px sans-serif',color:'#68c487'});
  let par=S.settings.map(r=>r[1]);
  row(['PAR',...par,par.slice(0,9).reduce((a,b)=>a+b,0),par.slice(9).reduce((a,b)=>a+b,0),par.reduce((a,b)=>a+b,0)]);
  let hcpIdx=S.settings.map(r=>r[2]);
  row(['HCP',...hcpIdx,'','','']);
  units.forEach(u=>{
    let cells=[u.label];let outSum=0,inSum=0,tot=0;
    for(let hh=0;hh<18;hh++){let g=scorecardHoleGross(u,hh);cells.push(g||'–');if(g){tot+=g;if(hh<9)outSum+=g;else inSum+=g;}}
    cells.push(outSum||'–',inSum||'–',tot||'–');
    row(cells,{font:'bold 12px sans-serif',color:'#ffffff'});
  });
  y+=16;
  units.forEach(u=>{
    let t=scorecardTotalsV2(u);
    ctx.textAlign='left';
    ctx.font='bold 15px sans-serif';ctx.fillStyle='#68c487';ctx.fillText(u.label,marginX,y);y+=20;
    ctx.font='13px sans-serif';ctx.fillStyle='#f4f7f4';
    if(t.front.played>0){let sd=halfDifferential(u,t.front,'front');ctx.fillText(`Front 9 (${t.front.played}/9): Brutto ${t.front.gross}${netLabelFor(t.front)}${sd!==null?` · SD ${diffLabel(sd,true)}`:''}`,marginX,y);y+=18;}
    if(t.back.played>0){let sd=halfDifferential(u,t.back,'back');ctx.fillText(`Back 9 (${t.back.played}/9): Brutto ${t.back.gross}${netLabelFor(t.back)}${sd!==null?` · SD ${diffLabel(sd,true)}`:''}`,marginX,y);y+=18;}
    if(t.full.played===18){let sd=fullDifferential(u,t.full);ctx.font='bold 13px sans-serif';ctx.fillStyle='#68c487';ctx.fillText(`Gesamt 18: Brutto ${t.full.gross}${netLabelFor(t.full)}${sd!==null?` · SD ${diffLabel(sd,false)}`:''}`,marginX,y);y+=18;ctx.font='13px sans-serif';ctx.fillStyle='#f4f7f4';}
    y+=14;
  });
  return canvas;
}

function computeBadges(){
  let badges=[];
  if(['count','short','stable'].includes(S.mode)){
    let birdieCounts=Array(S.count).fill(0);
    activeHoleIndices().forEach(h=>{
      let par=S.mode==='short'?S.par:S.settings[h][1];
      for(let p=0;p<S.count;p++){let g=Number(getData([S.mode,h,p],''));if(g&&g<par)birdieCounts[p]++;}
    });
    let max=Math.max(...birdieCounts);
    if(max>0){let winners=names().filter((n,p)=>birdieCounts[p]===max);badges.push({icon:'🐦',title:`Meiste Birdies (${max})`,player:winners.join(', ')});}
  }
  if(S.mode==='fun'){
    let bonusSums=Array.from({length:S.count},(_,p)=>activeHoleIndices().reduce((a,h)=>a+bonusFor(h,p),0));
    let max=Math.max(...bonusSums);
    if(max>0){let winners=names().filter((n,p)=>bonusSums[p]===max);badges.push({icon:'⭐',title:`Bonus-Champion (${max} Pkt)`,player:winners.join(', ')});}
  }
  if(S.mode==='wolf'){
    let pts=Array.from({length:S.count},(_,p)=>activeHoleIndices().reduce((a,h)=>a+wolfPoints(S.count,h%S.count,getData(['wolf',h,'pick'],''),getData(['wolf',h,'result'],'geteilt'))[p],0));
    let max=Math.max(...pts);
    if(max>0){let winners=names().filter((n,p)=>pts[p]===max);badges.push({icon:'🐺',title:`Wolf-König (${max} Pkt)`,player:winners.join(', ')});}
  }
  if(S.mode==='count'){
    for(let p=0;p<S.count;p++){
      let front=0,back=0,anyF=false,anyB=false;
      for(let h=0;h<9;h++){let g=Number(getData(['count',h,p],''));if(g){front+=g;anyF=true}}
      for(let h=9;h<18;h++){let g=Number(getData(['count',h,p],''));if(g){back+=g;anyB=true}}
      if(anyF&&anyB&&back<front){badges.push({icon:'🔥',title:`Starke Rückneun (${back} vs ${front})`,player:playerName(p)});}
    }
  }
  return badges;
}
function computeScorecardSummary(){
  if(S.mode==='match'){
    let hist=matchHoleHistory();
    if(!hist.length)return null;
    let [aName,bName]=matchNames();
    return {type:'match',aName,bName,finalLabel:matchFinalLabel(hist)};
  }
  if(modeHasScorecard()){
    let units=scorecardUnits().map(u=>{
      let t=scorecardTotalsV2(u);
      return {label:u.label,front:t.front,back:t.back,full:t.full,
        sdFront:halfDifferential(u,t.front,'front'),sdBack:halfDifferential(u,t.back,'back'),sdFull:fullDifferential(u,t.full)};
    });
    return {type:'stroke',mode:S.mode,units};
  }
  return null;
}
function renderHistoryScorecard(sc){
  if(!sc)return '';
  if(sc.type==='match')return `<div class="sub" style="margin-top:4px">Matchplay-Ergebnis: ${esc(sc.finalLabel)}</div>`;
  if(sc.type==='stroke'){
    return `<div style="margin-top:4px">${sc.units.map(u=>{
      let parts=[];
      if(u.front.played>0)parts.push(`Front9 ${u.front.gross}${netLabelFor(u.front)}${u.sdFront!==null?` SD ${diffLabel(u.sdFront,true)}`:''}`);
      if(u.back.played>0)parts.push(`Back9 ${u.back.gross}${netLabelFor(u.back)}${u.sdBack!==null?` SD ${diffLabel(u.sdBack,true)}`:''}`);
      if(u.full.played===18)parts.push(`Gesamt ${u.full.gross}${netLabelFor(u.full)}${u.sdFull!==null?` SD ${diffLabel(u.sdFull,false)}`:''}`);
      return `<div class="sub">${esc(u.label)}: ${parts.join(' · ')}</div>`;
    }).join('')}</div>`;
  }
  return '';
}

function sparkline(vals){
  if(vals.length<2)return `<div class="sub">Zu wenige Runden für einen Trend.</div>`;
  let w=260,h=48,pad=4;let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1;}
  let pts=vals.map((v,i)=>{let x=pad+(i/(vals.length-1))*(w-2*pad);let y=h-pad-((v-min)/(max-min))*(h-2*pad);return `${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');
  return `<svg width="${w}" height="${h}" style="display:block;margin-top:6px"><polyline points="${pts}" fill="none" stroke="#68c487" stroke-width="2"/></svg>`;
}

  <div class="settingCard"><label>Damen · rot · CR</label><input class="numInput" type="text" inputmode="decimal" value="${formatDecimalDE(S.courseRatingW!==undefined?S.courseRatingW:73.5)}" onchange="S.courseRatingW=toNum(this.value)||0;saveCourseMeta({slopeM:S.courseSlopeM,ratingM:S.courseRatingM,slopeW:S.courseSlopeW,ratingW:S.courseRatingW});save()"></div>
  </div></div>
  <div class="settingsGrid">${S.settings.map((r,i)=>`<div class="settingCard"><label>Loch ${i+1}</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input class="numInput" type="number" min="1" max="9" value="${r[1]}" onchange="S.settings[${i}][1]=Math.max(1,Math.min(9,Number(this.value)||4));localStorage.setItem('gd_course',JSON.stringify(S.settings));save()"><input class="numInput" type="number" min="1" max="18" value="${r[2]}" onchange="S.settings[${i}][2]=Math.max(1,Math.min(18,Number(this.value)||1));localStorage.setItem('gd_course',JSON.stringify(S.settings));save()"></div></div>`).join('')}</div><div class="section"><div class="label">Aktuelle Werte als neuer Platz speichern</div><div class="playerRow"><input class="textInput" id="newCourseName" placeholder="Name, z. B. Golfclub Nord"><button class="smallBtn" onclick="saveAsNewCourse()">Speichern</button></div></div>
  <div class="section"><div class="label">Team-Vorgabe-Faktoren</div><div class="settingsGrid">
  <div class="settingCard"><label>Scramble niedrig (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.scrLow}" onchange="updateTeamHcp('scrLow',this.value)"></div>
  <div class="settingCard"><label>Scramble hoch (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.scrHigh}" onchange="updateTeamHcp('scrHigh',this.value)"></div>
  <div class="settingCard"><label>Fourball Faktor (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.fb}" onchange="updateTeamHcp('fb',this.value)"></div>
  <div class="settingCard"><label>Chapman niedrig (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.chLow}" onchange="updateTeamHcp('chLow',this.value)"></div>
  <div class="settingCard"><label>Chapman hoch (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.chHigh}" onchange="updateTeamHcp('chHigh',this.value)"></div>
  <div class="settingCard"><label>Foursomes Faktor (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.foAvg}" onchange="updateTeamHcp('foAvg',this.value)"></div>
  <div class="settingCard"><label>Greensomes niedrig (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.grLow}" onchange="updateTeamHcp('grLow',this.value)"></div>
  <div class="settingCard"><label>Greensomes hoch (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.grHigh}" onchange="updateTeamHcp('grHigh',this.value)"></div>
  <div class="settingCard"><label>Fourball/Bridesmaid Faktor (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.bm}" onchange="updateTeamHcp('bm',this.value)"></div>
  </div><div class="hint" style="margin-top:6px">Bei Chapman/Foursomes/Greensomes/Scramble wird aus diesen Faktoren eine kombinierte Team-Vorgabe berechnet und an den schwersten Bahnen verteilt. Bei Fourball/Bridesmaid behält jeder Spieler seine eigene (anteilige) Vorgabe – das entspricht den offiziellen Bestball-Regeln.</div></div>
  <div class="section"><div class="label">String Golf</div><div class="settingsGrid">
  <div class="settingCard"><label>cm pro Vorgabe-Schlag</label><input class="numInput" type="number" min="1" step="1" value="${loadStringFactor()}" onchange="saveStringFactor(this.value)"></div>
  </div><div class="hint" style="margin-top:6px">Bestimmt, wie lang die virtuelle Schnur je Vorgabe-Schlag ist (z. B. 30 cm × Vorgabe 18 = 540 cm Budget).</div></div>
  <div class="modalActions"><button class="close" onclick="closeModal();save();render()">Fertig</button><button class="close danger" onclick="restoreCourse()">Varus zurücksetzen</button></div>${S.courseName&&S.courseName!=='Varus'?`<button class="close danger" style="width:100%;margin-top:8px" onclick="deleteCourse()">„${esc(S.courseName)}" löschen</button>`:''}`);
}
function switchCourse(name){let courses=loadCourses();let c=courses.find(x=>x.name===name);if(!c)return;S.courseName=name;S.settings=c.holes.map(x=>[...x]);S.courseSlopeM=c.slopeM||132;S.courseRatingM=c.ratingM!==undefined?c.ratingM:71.7;S.courseSlopeW=c.slopeW||132;S.courseRatingW=c.ratingW!==undefined?c.ratingW:73.5;localStorage.setItem('gd_course',JSON.stringify(S.settings));localStorage.setItem('gd_active_course',JSON.stringify(name));saveCourseMeta({slopeM:S.courseSlopeM,ratingM:S.courseRatingM,slopeW:S.courseSlopeW,ratingW:S.courseRatingW});save();courseSettings()}
function saveAsNewCourse(){let input=document.getElementById('newCourseName');let name=(input&&input.value||'').trim();if(!name)return;let courses=loadCourses();let idx=courses.findIndex(c=>c.name===name);let entry={name,holes:S.settings.map(x=>[...x]),slopeM:S.courseSlopeM,ratingM:S.courseRatingM,slopeW:S.courseSlopeW,ratingW:S.courseRatingW};if(idx>=0)courses[idx]=entry;else courses.push(entry);saveCourses(courses);S.courseName=name;localStorage.setItem('gd_active_course',JSON.stringify(name));save();courseSettings()}
function deleteCourse(){let courses=loadCourses().filter(c=>c.name!==S.courseName);saveCourses(courses);let varus=courses.find(c=>c.name==='Varus')||defaultCourses()[0];S.courseName='Varus';S.settings=varus.holes.map(x=>[...x]);S.courseSlopeM=varus.slopeM||132;S.courseRatingM=varus.ratingM!==undefined?varus.ratingM:71.7;S.courseSlopeW=varus.slopeW||132;S.courseRatingW=varus.ratingW!==undefined?varus.ratingW:73.5;localStorage.setItem('gd_course',JSON.stringify(S.settings));localStorage.setItem('gd_active_course',JSON.stringify('Varus'));saveCourseMeta({slopeM:S.courseSlopeM,ratingM:S.courseRatingM,slopeW:S.courseSlopeW,ratingW:S.courseRatingW});save();courseSettings()}
function restoreCourse(){S.settings=HOLES.map(x=>[...x]);S.courseName='Varus';S.courseSlopeM=VARUS_DEFAULT_META.slopeM;S.courseRatingM=VARUS_DEFAULT_META.ratingM;S.courseSlopeW=VARUS_DEFAULT_META.slopeW;S.courseRatingW=VARUS_DEFAULT_META.ratingW;localStorage.setItem('gd_course',JSON.stringify(S.settings));localStorage.setItem('gd_active_course',JSON.stringify('Varus'));saveCourseMeta(Object.assign({},VARUS_DEFAULT_META));save();courseSettings()}
function startGame(){
  if(!S.mode){showModal('<h2>Modus auswählen</h2><p>Bitte wähle zuerst einen Spielmodus.</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>');return}
  let n=S.count;let err='';
  if(S.mode==='531'&&n!==3)err='5–3–1 benötigt genau 3 Spieler.';
  if(S.mode==='vegas'&&n!==4)err='Las Vegas benötigt genau 4 Spieler.';
  if(['scramble','chapman','fourball','foursome','greensome','bridesmaid'].includes(S.mode)&&n!==4)err='Dieser Modus benötigt genau 4 Spieler (2 Teams à 2).';
  if(['scramble','chapman','fourball','foursome','greensome','bridesmaid'].includes(S.mode)&&n===4&&(teamMembers('A').length!==2||teamMembers('B').length!==2))err='Bitte teile die 4 Spieler unter „Team-Zuordnung" in zwei 2er-Teams (Team A / Team B) ein.';
  if(S.mode==='wolf'&&n<3)err='Wolf benötigt 3 oder 4 Spieler.';
  if(S.mode==='bbb'&&n<2)err='Bingo Bango Bongo benötigt mindestens 2 Spieler.';
  if(S.mode==='skins'&&n<2)err='Skins benötigt mindestens 2 Spieler.';
  if(S.mode==='nassau'&&n<2)err='Nassau benötigt mindestens 2 Spieler.';
  if(S.mode==='fun'&&n<2)err='Fun benötigt mindestens 2 Spieler.';
  if(S.mode==='match'&&![2,4].includes(n))err='Matchplay benötigt 2 oder 4 Spieler.';
  if(S.mode==='match'&&n===4)S.team=true;
  if(sixesActiveForMode()&&S.sixes.rotation==='block'&&S.sixes.blocks.some(b=>b===null||b===undefined))err='Bitte lose vor dem Start alle drei Sixes-Blöcke aus (oder wechsle zu „Jede Bahn neu").';
  if(err){showModal(`<h2>Hinweis</h2><p>${esc(err)}</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);return}
  S.players=Array.from({length:n},(_,i)=>S.players[i]?.trim()||`Spieler ${i+1}`);
  S.screen='game';save();render();scrollToCurrentHole();
}
function liveRefresh(el){const inputs=[...document.querySelectorAll('input')];const idx=inputs.indexOf(el);const st=typeof el.selectionStart==='number'?el.selectionStart:null,en=typeof el.selectionEnd==='number'?el.selectionEnd:null;render();const next=[...document.querySelectorAll('input')][idx];if(next){next.focus();if(st!==null&&next.setSelectionRange){try{next.setSelectionRange(st,en)}catch(e){}}}}
function updateScorebar(){
  let el=document.getElementById('scorebar');if(el)el.remove();if(S.screen!=='game')return;
  let vals;
  if(isTeam()){
    let sumBased=['count','fun','string'].includes(S.mode);
    if(sumBased){
      vals=[['Team A',teamMembers('A').reduce((a,p)=>a+scoreFor(p),0)],['Team B',teamMembers('B').reduce((a,p)=>a+scoreFor(p),0)]];
    } else {
      let repA=teamMembers('A')[0],repB=teamMembers('B')[0];
      vals=[['Team A',repA!==undefined?scoreFor(repA):0],['Team B',repB!==undefined?scoreFor(repB):0]];
    }
  } else {
    vals=names().map((n,p)=>[n,scoreFor(p)]);
  }
  let bar=document.createElement('div');bar.id='scorebar';bar.className='scorebar';bar.innerHTML=vals.map(x=>`<div class="scorechip"><b>${esc(x[1])}</b><small>${esc(x[0])}</small></div>`).join('');document.body.appendChild(bar);
}
applyTheme();
render();
(function checkIncomingSync(){
  try{
    if(location.hash&&location.hash.indexOf('#sync=')===0){
      let b64=location.hash.slice(6);
      setTimeout(()=>importSyncCode(b64),300);
    }
  }catch(e){}
})();
</script></body></html>
