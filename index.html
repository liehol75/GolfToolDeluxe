</style></head><body><div id="app"></div><div id="modalRoot"></div><script>
'use strict';
const MODES=[
 ['count','Zählspiel','18 Loch · niedrigste Schlagzahl gewinnt'],['match','Matchplay','Loch für Loch · Einzel oder 2 gegen 2'],['short','Kurzspiel-Competition','PAR-basierte Farbwertung'],['fun','Fun','Zufall · Bonus/Malus · Punkte'],['wolf','Wolf','Wolf wechselt · Punkte pro Loch'],['531','5–3–1','3 Spieler · 5/3/1-System'],['stable','Stableford','PAR + Vorgabe · Stableford'],['vegas','Las Vegas','4 Spieler · 2 Teams'],['bbb','Bingo Bango Bongo','3 Punkte pro Loch möglich'],['skins','Skins','Skins wandern bei Gleichstand weiter'],['nassau','Nassau','Front 9 · Back 9 · Gesamt'],

];
const LOWER_BETTER=['count','short','nassau','scramble','chapman','fourball'];
const FUNMODES=['Zufallsschläger (Luck of the draw)','Zufallsschläger für Alle (ganze Bahn)','Pflichtfairway/-grün','Scramble Worst Ball','Scramble Best Ball','Nimm 2 - Best Ball','Nimm 2 - Worst Ball','Von Rot','Nur Pitching Wedge','Nur Eisen 7','Nur Holz','Nur Driver','Nur Putter','Leder Wedge (Mitspieler, x-Mal, Grün rettet)','Leder Wedge - x-Mal','Leder Wedge - ein Mal','Nur 2 Schläger','Leder Wedge (Mitspieler, 1 Mal, Grün rettet)','No Iron','No Putter','Nur Eisen','Nur Wedges','Caddie-Modus (Mitspieler wählen Schläger)'];
const CLUBS=['Driver','Hybrid','Holz 3','Holz 5','Eisen 4','Eisen 5','Eisen 6','Eisen 7','Eisen 8','Eisen 9','Pitching Wedge','Gap Wedge','Sand Wedge','Lob Wedge','Putter'];
const BONUS=[['Hole Out',1],['Chip In',1],['1-Putt',1],['3-Putt',-1],['Bunker',-1],['Holz getroffen',-1],['Penalty Area',-1],['Lady',-1],['Schneckenficker',-1],['Adolf',-1],['Luftschlag',-1],['Fairway verfehlt',-1],['Green in regulation',1],['Gescramblet',1],['Nearest to the pin (PAR 3)',1],['Out of bounds',-1],['Birdie',1],['Eagle',2],['Falsches PAR',1],['Sandy PAR',1],['Socket',-1],["Über‘s Grün getoppt",-1],['Vom Grün geputtet',-1],['2 Chips',-1],['Doppel-PAR und mehr',-1],['Texas Wedge gelocht',1]];
const HOLES=[ [1,4,11],[2,4,7],[3,3,17],[4,5,9],[5,4,1],[6,3,15],[7,5,3],[8,4,13],[9,4,5],[10,4,10],[11,4,12],[12,3,14],[13,5,4],[14,4,2],[15,4,16],[16,5,6],[17,3,18],[18,4,8] ];
const MODEINFO={
 count:'Zählspiel: Für jedes Loch wird die Schlagzahl eingetragen. Unter Loch 18 steht der aktuelle Gesamtscore.',
 match:'Matchplay: 2 Einzelspieler oder 2 Teams (4 Spieler, dann fest Team A gegen Team B). Gewonnen = 1 Up, verloren = 1 Down, geteilt = Tied. Die Anzeige zeigt „X Up/Down", solange das Match noch offen ist, und erst „X & Y", wenn der Vorsprung größer als die verbleibenden Löcher ist. Im Einzel ist zusätzlich eine Variante „Mit Vorgabe" wählbar: Dort werden Bruttoschläge eingetragen und die Lochergebnisse automatisch anhand der Handicap-Differenz berechnet.',
 short:'Kurzspiel-Competition: Ein PAR gilt für alle 18 Löcher. Die Farbe/Form zeigt die Abweichung vom PAR.',
 fun:'Fun: Pro Loch wird ein Modus manuell ausgelost (Button „auslosen"). Zusätzlich können pro Spieler Bonus-/Maluspunkte vergeben werden. Welche Spielformen und Bonus-Ereignisse überhaupt gezogen werden können, legst du unter „Fun-Modi & Bonus verwalten" fest – dort kannst du auch eigene ergänzen.',
 wolf:'Wolf: Der Wolf wechselt pro Loch. Der Wolf wählt Mitspieler oder Lone Wolf; danach wird die Punktwertung automatisch berechnet. In der Blind-Wolf-Variante wählt der Wolf seinen Partner, bevor die Ergebnisse feststehen – alle Punkte werden dafür verdoppelt.',
 531:'5–3–1: Nur 3 Spieler. Bestes Ergebnis erhält 5, zweitbestes 3, schlechtestes 1. Bei Gleichständen greifen die festgelegten Sonderregeln.',
 stable:'Stableford: PAR/HCP-Index des Platzes sind vorbelegt. Die Spielvorgabe wird lochweise verteilt.',
 vegas:'Las Vegas: 4 Spieler, Team A = Spieler 1+2, Team B = Spieler 3+4. Die kleinere Zahl steht zuerst; bei Birdie wird die gegnerische Zahl gedreht.',
 bbb:'Bingo Bango Bongo: Drei Auszeichnungen je Loch – erster auf dem Grün, nearest to the pin und erster im Loch. Jede gibt 1 Punkt.',
 skins:'Skins: Jeder Skin geht an den alleinigen Lochgewinner. Bei Gleichstand wird der Skin auf das nächste Loch übertragen. Unten siehst du, an welchen Löchern jeder Spieler seine Skins geholt hat.',
 nassau:'Nassau: Drei Wertungen – Front 9, Back 9 und Gesamt 18. Oben siehst du den laufenden Zwischenstand für alle drei Wertungen.',
 scramble:'Scramble: 2 Teams à 2 Spieler spielen jeweils mit einem Ball – nach jedem Schlag wird der bessere Ball gewählt. Pro Loch wird nur eine gemeinsame Teamschlagzahl eingetragen. Optional wird eine Team-Vorgabe (Standard: 35% des niedrigeren + 15% des höheren Handicaps) vom Gesamtergebnis abgezogen.',
 fourball:'Fourball Bestball: Jeder Spieler spielt seinen eigenen Ball. Pro Loch zählt das bessere Nettoergebnis je Team. Optional erhält jeder Spieler einen Anteil (Standard 90%) seiner Vorgabe, lochweise über den Course-HCP-Index verteilt.',
 chapman:'Chapman-Vierer (Pinehurst): Beide Spieler schlagen ab, spielen dann den Ball des Partners weiter, bevor ab dem dritten Schlag ein Ball gewählt und zu Ende gespielt wird. Eingetragen wird die resultierende Teamschlagzahl. Optional Team-Vorgabe (Standard: 60% niedrigeres + 40% höheres Handicap).'
};
let S=load();
let undoStack=[];
let pendingMode=null;
let THEME=localStorage.getItem('gd_theme')||'auto';
function defaultCourses(){let legacy=JSON.parse(localStorage.getItem('gd_course')||'null');return [{name:'Varus',holes:(legacy||HOLES).map(x=>[...x])}]}
function loadCourses(){try{let c=JSON.parse(localStorage.getItem('gd_courses')||'null');if(!Array.isArray(c)||!c.length)return defaultCourses();return c}catch(e){return defaultCourses()}}
function saveCourses(list){localStorage.setItem('gd_courses',JSON.stringify(list))}
function blankState(){return {screen:'home',mode:null,players:[],count:2,team:false,par:4,stableHcp:[0,0,0,0],matchHcp:false,teamFormatHcp:false,wolfBlind:false,holeDone:Array(18).fill(false),data:{},fun:{holeModes:Array(18).fill(null),unique:false,clubs:Array(18).fill(null),shotClubs:Array.from({length:18},()=>[]),bonus:Array.from({length:18},()=>Array.from({length:4},()=>[]))},courseName:JSON.parse(localStorage.getItem('gd_active_course')||'null')||'Varus',settings:JSON.parse(localStorage.getItem('gd_course')||'null')||HOLES.map(x=>[...x]),timestamp:Date.now()};}
function load(){try{return Object.assign(blankState(),JSON.parse(localStorage.getItem('golfDeluxe')||'{}'))}catch(e){return blankState()}}
function save(){localStorage.setItem('golfDeluxe',JSON.stringify(S));}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function playerName(i){return S.players[i]||`Spieler ${i+1}`}
function names(){return Array.from({length:S.count},(_,i)=>playerName(i))}
function isTeam(){return S.team&&S.count===4&&['count','match','fun','scramble','chapman','fourball'].includes(S.mode)}
function modeLabel(){return MODES.find(m=>m[0]===S.mode)?.[1]||''}
function pushUndo(entry){undoStack.push(entry);if(undoStack.length>25)undoStack.shift();}
function setData(path,val){let prev=getData(path,undefined);pushUndo({path:[...path],prev});let o=S.data;for(let i=0;i<path.length-1;i++){if(o[path[i]]==null)o[path[i]]={};o=o[path[i]]}o[path[path.length-1]]=val;save()}
function undoLast(){if(!undoStack.length)return;let last=undoStack.pop();let o=S.data;for(let i=0;i<last.path.length-1;i++){if(o[last.path[i]]==null)o[last.path[i]]={};o=o[last.path[i]]}let key=last.path[last.path.length-1];if(last.prev===undefined){delete o[key]}else{o[key]=last.prev}save();render()}
function getData(path,def=''){let o=S.data;for(const k of path){if(o==null)return def;o=o[k]}return o==null?def:o}
function currentHoleIndex(){let i=S.holeDone.findIndex(x=>!x);return i===-1?17:i}
function scrollToCurrentHole(){requestAnimationFrame(()=>{let el=document.querySelector('.curHole');if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'})})}
function render(){const app=document.getElementById('app'); if(S.screen==='home')app.innerHTML=home();else app.innerHTML=game(); updateScorebar();}

/* ---------- Theme ---------- */
function applyTheme(){
  let eff=THEME;
  if(THEME==='auto'){eff=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';}
  if(eff==='dark')document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',eff);
}
function themeIcon(){return THEME==='auto'?'🌓':THEME==='dark'?'🌙':THEME==='light'?'☀️':'◐'}
function cycleTheme(){const order=['auto','dark','light','contrast'];THEME=order[(order.indexOf(THEME)+1)%order.length];localStorage.setItem('gd_theme',THEME);applyTheme();render();}
try{if(window.matchMedia)window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(THEME==='auto')applyTheme()})}catch(e){}

/* ---------- Player-Profile ---------- */
function loadProfiles(){try{let a=JSON.parse(localStorage.getItem('gd_profiles')||'[]');if(!Array.isArray(a))return [];return a.map(p=>typeof p==='string'?{name:p,hcp:0}:p)}catch(e){return []}}
function saveProfiles(a){localStorage.setItem('gd_profiles',JSON.stringify(a))}
function profilePicker(slot){
  let profiles=loadProfiles();
  showModal(`<h2>👤 Spieler wählen</h2>${profiles.length?`<div class="bonusList">${profiles.map((p,i)=>`<div class="bonusItem"><div><b>${esc(p.name)}</b><br><em>Letzte Vorgabe: ${p.hcp||0}</em></div><div style="display:flex;gap:6px"><button onclick="pickProfile(${slot},${i})">Wählen</button><button class="danger" style="min-width:36px" onclick="deleteProfile(${i},${slot})">✕</button></div></div>`).join('')}</div>`:'<p>Noch keine gespeicherten Spieler. Trag unten einen Namen ein und speichere ihn.</p>'}
  <div class="section"><div class="label">Neuen Spieler speichern</div><div class="playerRow"><input class="textInput" id="newProfileName" placeholder="Name"><button class="smallBtn" onclick="addProfile(${slot})">Speichern</button></div></div>
  <div class="note">Die zuletzt gespeicherte Vorgabe wird beim Auswählen automatisch übernommen, bleibt aber jederzeit im Feld „Spielvorgaben" änderbar.</div>
  <div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);
}

function scrambleTeamHcp(p1,p2){let f=loadTeamHcp();let lo=Math.min(p1,p2),hi=Math.max(p1,p2);return Math.round(f.scrLow*lo+f.scrHigh*hi)}

function hcpCalculator(){
  showModal(`<h2>🧮 Course-Handicap-Rechner</h2><p>Berechnet dein Course Handicap aus Handicap-Index, Slope und Course Rating (offizielle Formel: Index × Slope/113 + (Rating − PAR)).</p>
  <div class="section"><div class="playerRow"><input class="numInput" id="hcIndex" type="number" step="0.1" placeholder="Handicap-Index"></div></div>
  <div class="section"><div class="playerRow"><input class="numInput" id="hcSlope" type="number" placeholder="Slope (z. B. 125)"></div></div>
  <div class="section"><div class="playerRow"><input class="numInput" id="hcRating" type="number" step="0.1" placeholder="Course Rating"></div></div>
  <div class="section"><div class="playerRow"><input class="numInput" id="hcPar" type="number" placeholder="Platz-PAR" value="${S.settings.reduce((a,r)=>a+r[1],0)}"></div></div>
  <div class="section"><button class="secondary" onclick="calcCourseHcp()">Berechnen</button></div>
  <div id="hcResult" class="note" style="display:none"></div>
  <div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);
}
function calcCourseHcp(){
  let idx=Number(document.getElementById('hcIndex').value)||0;
  let slope=Number(document.getElementById('hcSlope').value)||113;
  let rating=Number(document.getElementById('hcRating').value)||0;
  let par=Number(document.getElementById('hcPar').value)||72;
  let ch=Math.round(idx*(slope/113)+(rating-par));
  let el=document.getElementById('hcResult');
  el.style.display='block';
  el.innerHTML=`Course Handicap: <b>${ch}</b>`;
}

/* ---------- Schnelleingabe (Stepper) ---------- */
function currentHoleFields(h){
  const m=S.mode;
  if(['count','short','stable','nassau','skins'].includes(m))return Array.from({length:S.count},(_,p)=>({label:playerName(p),path:[m,h,p]}));
  if(m==='531')return Array.from({length:3},(_,p)=>({label:playerName(p),path:['531',h,p]}));
  if(m==='vegas'||m==='fourball')return Array.from({length:4},(_,p)=>({label:playerName(p),path:[m,h,p]}));
  if(m==='scramble'||m==='chapman')return [{label:'Team A',path:[m,h,0]},{label:'Team B',path:[m,h,1]}];
  if(m==='match'&&S.matchHcp&&S.count===2)return [{label:playerName(0),path:['matchhcp',h,0]},{label:playerName(1),path:['matchhcp',h,1]}];
  if(m==='fun')return Array.from({length:S.count},(_,p)=>({label:playerName(p),path:['fun','results',h,p]}));

}
function openStepper(){
  let h=currentHoleIndex();

  showModal(`<h2>⚡ Loch ${h+1}</h2>
  <div class="bonusList">${fields.map((f,i)=>{
    let raw=getData(f.path,'');

function stepperAdjust(h,i,delta){

/* ---------- Matchplay ---------- */
function matchStatus(d,r){
  const lead=Math.abs(d);
  if(d===0) return r===0 ? {a:'Tied',b:'Tied'} : {a:'All Square',b:'All Square'};
  if(r===0) return d>0 ? {a:`${lead} Up`,b:`${lead} Down`} : {a:`${lead} Down`,b:`${lead} Up`};
  if(lead>r) return d>0 ? {a:`${lead} & ${r}`,b:'Verloren'} : {a:'Verloren',b:`${lead} & ${r}`};
  const dormie = lead===r;
  return d>0
    ? {a:`${lead} Up${dormie?' (Dormie)':''}`, b:`${lead} Down`}
    : {a:`${lead} Down`, b:`${lead} Up${dormie?' (Dormie)':''}`};
}
function matchHcpAlloc(){
  let hA=Number(S.stableHcp[0])||0, hB=Number(S.stableHcp[1])||0;
  let diff=Math.round(Math.abs(hA-hB));
  let weaker = hA>hB?'A':'B';
  let allocA=Array(18).fill(0), allocB=Array(18).fill(0);
  for(let i=0;i<18;i++){
    let extra=Math.floor(diff/18)+(S.settings[i][2]<=diff%18?1:0);
    if(weaker==='A')allocA[i]=extra; else allocB[i]=extra;
  }
  return {allocA,allocB,weaker};
}
function matchDiffHcp(){
  let {allocA,allocB}=matchHcpAlloc();let diff=0;
  for(let h=0;h<18;h++){
    let gA=Number(getData(['matchhcp',h,0],'')), gB=Number(getData(['matchhcp',h,1],''));
    if(gA&&gB){let nA=gA-allocA[h], nB=gB-allocB[h];if(nA<nB)diff++; else if(nB<nA)diff--;}
  }
  return diff;
}
function matchGameHcp(){
  let {allocA,allocB,weaker}=matchHcpAlloc();
  let diff=matchDiffHcp();
  let playedHoles=Array.from({length:18},(_,h)=>getData(['matchhcp',h,0],'')&&getData(['matchhcp',h,1],'')).filter(Boolean).length;
  let remaining=18-playedHoles;

function rerollFun(h){
  let active=loadActiveFun().filter(m=>allFunModes().includes(m));
  if(!active.length)active=allFunModes();
  let pool=active.slice();
  if(S.fun.unique){let used=S.fun.holeModes.filter((v,i)=>i!==h&&v);let avail=pool.filter(x=>!used.includes(x));if(!avail.length)avail=pool;pool=avail;}
  let pick=pool[Math.floor(Math.random()*pool.length)];
  S.fun.holeModes[h]=pick;
  S.fun.clubs[h]=pick==='Zufallsschläger für Alle (ganze Bahn)'?CLUBS[Math.floor(Math.random()*CLUBS.length)]:null;
  if(pick==='Zufallsschläger (Luck of the draw)')S.fun.shotClubs[h]=Array.from({length:S.count},()=>[]);
  save();render();
}
function funInput(h,p,value,el){setData(['fun','results',h,p],value);let mode=S.fun.holeModes[h];if(mode==='Zufallsschläger (Luck of the draw)'){let n=Math.max(0,Math.min(30,Number(value)||0));S.fun.shotClubs[h][p]=S.fun.shotClubs[h][p]||[];while(S.fun.shotClubs[h][p].length<n)S.fun.shotClubs[h][p].push(CLUBS[Math.floor(Math.random()*CLUBS.length)]);if(S.fun.shotClubs[h][p].length>n)S.fun.shotClubs[h][p].length=n;save()}liveRefresh(el)}
function rerollShotClubs(h,p){let n=(S.fun.shotClubs[h]?.[p]||[]).length;if(!n)return;S.fun.shotClubs[h][p]=Array.from({length:n},()=>CLUBS[Math.floor(Math.random()*CLUBS.length)]);save();render();}
function shotClubDisplay(h,p){let a=S.fun.shotClubs[h]?.[p]||[];if(!a.length)return '';return '<div class="sub" style="line-height:1.25;margin-top:3px">'+a.map((c,i)=>`${i+1}. ${esc(c)}`).join(' · ')+'</div>'}
function funPointsForHole(h){let vals=Array.from({length:S.count},(_,p)=>Number(getData(['fun','results',h,p],'')));if(isTeam()){if(vals.some(v=>!v||v<=0))return Array(S.count).fill(0);let a=vals[0]+vals[1],b=vals[2]+vals[3],out=Array(4).fill(0);if(a<b){out[0]=out[1]=1;out[2]=out[3]=-1}else if(b<a){out[0]=out[1]=-1;out[2]=out[3]=1}return out}return funPoints(vals)}
function funPoints(vals){let idx=vals.map((v,i)=>({v,i})).filter(x=>Number.isFinite(x.v)&&x.v>0).sort((a,b)=>a.v-b.v);if(!idx.length)return Array(S.count).fill(0);let n=S.count, out=Array(n).fill(0);if(n===2){if(idx.length<2)return out;if(idx[0].v===idx[1].v)return out;out[idx[0].i]=1;out[idx[1].i]=-1;return out}let groups=[];for(let i=0;i<idx.length;){let j=i;while(j<idx.length&&idx[j].v===idx[i].v)j++;groups.push(idx.slice(i,j));i=j}let valsPts=n===3?[1,0,-1]:[2,1,-1,-2];let pos=0;for(const g of groups){let rank=Math.min(pos,valsPts.length-1);let pv=valsPts[rank];g.forEach(x=>out[x.i]=pv);pos+=g.length}return out}

/* ---------- 5-3-1 ---------- */
function pts531(vals){
  if(vals.some(v=>!v||v<=0))return [0,0,0];
  let s=vals.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);
  let out=[0,0,0];
  if(s[0].v===s[2].v){out[0]=out[1]=out[2]=3;return out}
  if(s[0].v===s[1].v){s.forEach(x=>out[x.i]=x.v===s[0].v?4:1);return out}
  if(s[1].v===s[2].v){s.forEach(x=>out[x.i]=x.v===s[2].v?2:5);return out}
  out[s[0].i]=5;out[s[1].i]=3;out[s[2].i]=1;
  return out;
}
function game531(){let totals=[0,0,0];return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>{let vals=Array.from({length:3},(_,p)=>Number(getData(['531',h,p],'')));let pts=pts531(vals);pts.forEach((x,p)=>totals[p]+=x);return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${Array.from({length:3},(_,p)=>`<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['531',h,p],'')}" oninput="setData(['531',${h},${p}],this.value);liveRefresh(this)"><div class="sub rankPts">${pts[p]}</div></td>`).join('')}</tr>`}).join('')}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div>`}

function holeHandicap(){let out=Array.from({length:S.count},()=>Array(18).fill(0));for(let p=0;p<S.count;p++){let strokes=Number(S.stableHcp[p])||0;for(let i=0;i<18;i++)out[p][i]=Math.floor(strokes/18)+(S.settings[i][2]<=strokes%18?1:0)}return out.map(a=>a)}

function vegasCompute(){let totals=[0,0];let holeData=[];for(let h=0;h<18;h++){let vals=Array.from({length:4},(_,p)=>Number(getData(['vegas',h,p],'')));let a=vals.slice(0,2).every(Boolean)?`${Math.min(vals[0],vals[1])}${Math.max(vals[0],vals[1])}`:'';let b=vals.slice(2,4).every(Boolean)?`${Math.min(vals[2],vals[3])}${Math.max(vals[2],vals[3])}`:'';let birdA=getData(['vegas',h,'birdA'],false),birdB=getData(['vegas',h,'birdB'],false);let shownA=a,shownB=b;if(birdB&&a)shownA=`${a[1]}${a[0]}`;if(birdA&&b)shownB=`${b[1]}${b[0]}`;if(a)totals[0]+=Number(shownA);if(b)totals[1]+=Number(shownB);holeData.push({vals,shownA,shownB,birdA,birdB});}return {totals,holeData}}
function vegasGame(){let {totals,holeData}=vegasCompute();return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map((n,i)=>`<th class="teamHead">${esc(n)}<span class="sub">Team ${i<2?'A':'B'}</span></th>`).join('')}<th>Teams</th></tr></thead><tbody>${holeData.map((info,h)=>{let {vals,shownA,shownB,birdA,birdB}=info;return `<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${vals.map((v,p)=>`<td><input class="compact" inputmode="numeric" type="number" min="0" max="99" value="${getData(['vegas',h,p],'')}" oninput="setData(['vegas',${h},${p}],this.value);liveRefresh(this)"></td>`).join('')}<td><div class="pill">A ${shownA||'—'}</div><div class="pill">B ${shownB||'—'}</div><label class="sub" style="display:block;margin-top:5px;text-align:left"><input type="checkbox" ${birdA?'checked':''} onchange="setData(['vegas',${h},'birdA'],this.checked);render()"> Birdie Team A</label><label class="sub" style="display:block;margin-top:3px;text-align:left"><input type="checkbox" ${birdB?'checked':''} onchange="setData(['vegas',${h},'birdB'],this.checked);render()"> Birdie Team B</label></td></tr>`}).join('')}<tr><td class="sum">Σ</td><td colspan="2" class="sum">Team A ${totals[0]}</td><td colspan="2" class="sum">Team B ${totals[1]}</td><td></td></tr></tbody></table></div>`}

/* ---------- Bingo Bango Bongo ---------- */
function bbbGame(){let totals=Array(S.count).fill(0);return `<div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>{let awards=['bingo','bango','bongo'];let cur=h===currentHoleIndex()?'curHole':'';return `<tr class="${cur}"><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${Array.from({length:S.count},(_,p)=>{let pts=awards.reduce((a,k)=>a+(getData(['bbb',h,k],-1)==p?1:0),0);totals[p]+=pts;return `<td class="points">${pts}</td>`}).join('')}</tr><tr class="${cur}"><td class="hole">↳</td><td colspan="${S.count}">${awards.map((k,i)=>`<label class="sub" style="display:block;text-align:left;margin:4px 0">${['Bingo – erster auf dem Grün','Bango – nearest to the pin (alle auf Grün)','Bongo – erster im Loch'][i]} <select class="select" onchange="setData(['bbb',${h},'${k}'],Number(this.value));save();updateScorebar()"><option value="-1">—</option>${names().map((n,p)=>`<option value="${p}" ${getData(['bbb',h,k],-1)==p?'selected':''}>${esc(n)}</option>`).join('')}</select></label>`).join('')}</td></tr>`}).join('')}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div>`}

/* ---------- Skins ---------- */
function skinsCompute(){let totals=Array(S.count).fill(0);let carry=1;let holeInfo=[];let wins=Array.from({length:S.count},()=>[]);for(let h=0;h<18;h++){let vals=Array.from({length:S.count},(_,p)=>Number(getData(['skins',h,p],'')));let complete=vals.every(v=>v>0);if(complete){let best=Math.min(...vals);let winners=vals.map((v,p)=>v===best?p:null).filter(p=>p!==null);if(winners.length===1){totals[winners[0]]+=carry;wins[winners[0]].push({hole:h+1,skins:carry});carry=1}else carry++;}holeInfo.push(vals);}return {totals,carry,holeInfo,wins}}
function skinsGame(){let {totals,carry,holeInfo,wins}=skinsCompute();let rows=holeInfo.map((vals,h)=>`<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${vals.map((v,p)=>`<td><input class="compact" type="number" inputmode="numeric" min="0" max="99" value="${getData(['skins',h,p],'')}" oninput="setData(['skins',${h},${p}],this.value);liveRefresh(this)"></td>`).join('')}</tr>`).join('');return `<div class="note">Ein Skin geht an den alleinigen Lochgewinner. Bei Gleichstand wandert er weiter; der nächste alleinige Gewinner erhält die aufgelaufenen Skins. Aktueller Carry: <b>${carry}</b>.</div><div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${rows}<tr><td class="sum">Σ</td>${totals.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div><div class="miniGrid" style="margin-top:9px">${names().map((n,p)=>`<div class="settingCard"><b>${esc(n)}</b><div class="sub">${wins[p].length?wins[p].map(w=>`Loch ${w.hole}${w.skins>1?` (+${w.skins})`:''}`).join(', '):'noch keine Skins'}</div></div>`).join('')}</div>`}

/* ---------- Nassau ---------- */
function nassauCompute(){let front=Array(S.count).fill(0),back=Array(S.count).fill(0),all=Array(S.count).fill(0);for(let h=0;h<18;h++){let vals=Array.from({length:S.count},(_,p)=>Number(getData(['nassau',h,p],'')));for(let p=0;p<S.count;p++){if(vals[p]>0){all[p]+=vals[p];if(h<9)front[p]+=vals[p];else back[p]+=vals[p]}}}return {front,back,all}}
function nassauLeaderLabel(arr){let entries=names().map((n,p)=>[n,arr[p]]).filter(x=>x[1]>0);if(!entries.length)return '—';let min=Math.min(...entries.map(x=>x[1]));let leaders=entries.filter(x=>x[1]===min);if(leaders.length>1)return 'Gleichstand';return `${leaders[0][0]} (${leaders[0][1]})`}
function nassauGame(){let {front,back,all}=nassauCompute();return `<div class="note">Nassau wird als drei Schlagzahl-Wertungen geführt: Front 9, Back 9 und Gesamt 18. Bei Gleichstand gibt es keinen alleinigen Sieger.</div><div class="miniGrid" style="margin-bottom:9px"><div class="settingCard"><label>Front 9 Zwischenstand</label><b>${esc(nassauLeaderLabel(front))}</b></div><div class="settingCard"><label>Back 9 Zwischenstand</label><b>${esc(nassauLeaderLabel(back))}</b></div><div class="settingCard"><label>Gesamt Zwischenstand</label><b>${esc(nassauLeaderLabel(all))}</b></div></div><div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${Array.from({length:18},(_,h)=>`<tr class="${h===currentHoleIndex()?'curHole':''}"><td class="hole">${h+1}<button class="holeDone" onclick="event.stopPropagation();toggleHole(${h})">${S.holeDone[h]?'✓':'○'}</button></td>${Array.from({length:S.count},(_,p)=>`<td><input class="compact" type="number" inputmode="numeric" min="0" max="99" value="${getData(['nassau',h,p],'')}" oninput="setData(['nassau',${h},${p}],this.value);liveRefresh(this)"></td>`).join('')}</tr>`).join('')}<tr><td class="sum">Σ</td>${all.map(t=>`<td class="sum">${t}</td>`).join('')}</tr></tbody></table></div><div class="miniGrid" style="margin-top:9px">${names().map((n,p)=>`<div class="settingCard"><b>${esc(n)}</b><div class="sub">Front 9 · ${front[p]}</div><div class="sub">Back 9 · ${back[p]}</div><div class="points">Gesamt · ${all[p]}</div></div>`).join('')}</div>`}

function fourballGame(){

  return `<div class="note">Team A best Netto vs Team B best Netto je Loch. ${S.teamFormatHcp?`Jeder Spieler erhält ${Math.round(f.fb*100)}% seiner Vorgabe, lochweise verteilt.`:'Ohne Vorgabe – Bruttowertung.'}</div>
  <div class="card"><table class="table"><thead><tr><th class="hole">Loch</th>${names().map((n,i)=>`<th>${esc(n)}<span class="sub">${i<2?'A':'B'}</span></th>`).join('')}<th>Beste</th></tr></thead><tbody>${rows}

/* ---------- Scoreboard / Verlauf ---------- */
function scoreFor(p){
  if(S.mode==='count')return Array.from({length:18},(_,h)=>Number(getData(['count',h,p],0))||0).reduce((a,b)=>a+b,0);
  if(S.mode==='match'){
    if(S.matchHcp&&S.count===2){let diff=matchDiffHcp();return p===0?diff:-diff;}
    let diff=Array.from({length:18},(_,h)=>Number(getData(['match',h],0))||0).reduce((a,b)=>a+b,0);
    if(isTeam())return p<2?diff:-diff;
    return p===0?diff:-diff;
  }
  if(S.mode==='short')return Array.from({length:18},(_,h)=>Number(getData(['short',h,p],''))||0).reduce((a,b)=>a+b,0);
  if(S.mode==='fun')return Array.from({length:18},(_,h)=>funPointsForHole(h)[p]+bonusFor(h,p)).reduce((a,b)=>a+b,0);
  if(S.mode==='stable')return stableTotal(p);
  if(S.mode==='bbb')return Array.from({length:18},(_,h)=>['bingo','bango','bongo'].reduce((a,k)=>a+(getData(['bbb',h,k],-1)==p?1:0),0)).reduce((a,b)=>a+b,0);
  if(S.mode==='wolf')return Array.from({length:18},(_,h)=>wolfPoints(S.count,h%S.count,getData(['wolf',h,'pick'],''),getData(['wolf',h,'result'],'geteilt'))[p]).reduce((a,b)=>a+b,0);
  if(S.mode==='531')return Array.from({length:18},(_,h)=>pts531(Array.from({length:3},(_,q)=>Number(getData(['531',h,q],''))))[p]).reduce((a,b)=>a+b,0);
  if(S.mode==='vegas'){let {totals}=vegasCompute();return p<2?totals[0]:totals[1];}
  if(S.mode==='skins')return skinsCompute().totals[p];
  if(S.mode==='nassau')return nassauCompute().all[p];
  if(S.mode==='scramble'){let totA=0,totB=0;for(let h=0;h<18;h++){totA+=Number(getData(['scramble',h,0],0))||0;totB+=Number(getData(['scramble',h,1],0))||0}let hcpA=S.teamFormatHcp?scrambleTeamHcp(Number(S.stableHcp[0])||0,Number(S.stableHcp[1])||0):0;let hcpB=S.teamFormatHcp?scrambleTeamHcp(Number(S.stableHcp[2])||0,Number(S.stableHcp[3])||0):0;return p<2?totA-hcpA:totB-hcpB;}
  if(S.mode==='chapman'){let totA=0,totB=0;for(let h=0;h<18;h++){totA+=Number(getData(['chapman',h,0],0))||0;totB+=Number(getData(['chapman',h,1],0))||0}let hcpA=S.teamFormatHcp?chapmanTeamHcp(Number(S.stableHcp[0])||0,Number(S.stableHcp[1])||0):0;let hcpB=S.teamFormatHcp?chapmanTeamHcp(Number(S.stableHcp[2])||0,Number(S.stableHcp[3])||0):0;return p<2?totA-hcpA:totB-hcpB;}
  if(S.mode==='fourball'){
    let f=loadTeamHcp();
    let hcp=Array.from({length:4},(_,pp)=>S.teamFormatHcp?Math.round((Number(S.stableHcp[pp])||0)*f.fb):0);
    let alloc=Array.from({length:4},(_,pp)=>{let out=Array(18).fill(0);for(let i=0;i<18;i++)out[i]=Math.floor(hcp[pp]/18)+(S.settings[i][2]<=hcp[pp]%18?1:0);return out});
    let totA=0,totB=0;
    for(let h=0;h<18;h++){
      let vals=Array.from({length:4},(_,pp)=>Number(getData(['fourball',h,pp],'')));
      let nets=vals.map((v,pp)=>v?v-alloc[pp][h]:null);
      let bestA=nets[0]!=null&&nets[1]!=null?Math.min(nets[0],nets[1]):(nets[0]??nets[1]);
      let bestB=nets[2]!=null&&nets[3]!=null?Math.min(nets[2],nets[3]):(nets[2]??nets[3]);
      if(bestA!=null)totA+=bestA; if(bestB!=null)totB+=bestB;
    }
    return p<2?totA:totB;
  }
  return 0;
}
function computeStandings(){
  let asc=LOWER_BETTER.includes(S.mode);
  if(isTeam()){
    let sums=[0,0];
    if(S.mode==='count'||S.mode==='fun'){for(let p=0;p<2;p++)sums[0]+=scoreFor(p);for(let p=2;p<4;p++)sums[1]+=scoreFor(p);}
    else{sums[0]=scoreFor(0);sums[1]=scoreFor(2);}
    let arr=[['Team A',sums[0]],['Team B',sums[1]]];
    return asc?arr.sort((a,b)=>a[1]-b[1]):arr.sort((a,b)=>b[1]-a[1]);
  }
  let arr=names().map((n,p)=>[n,scoreFor(p)]);
  return asc?arr.sort((a,b)=>a[1]-b[1]):arr.sort((a,b)=>b[1]-a[1]);
}
function scoreboard(){let arr=computeStandings();showModal(`<h2>🏆 Scoreboard</h2><p>Aktueller Überblick · ${modeLabel()} · ${esc(S.courseName||'Varus')}</p>${arr.map((x,i)=>`<div class="settingCard" style="display:flex;justify-content:space-between;align-items:center;margin:6px 0"><b>${i+1}. ${esc(x[0])}</b><span class="points">${x[1]}</span></div>`).join('')}<div class="section"><button class="secondary" onclick="shareRound()">📤 Ergebnis teilen</button></div><div class="section"><button class="secondary" onclick="exportScorecardImage()">🖼️ Als Bild exportieren</button></div><div class="section"><button class="secondary" onclick="finishRoundConfirm()">🏁 Runde abschließen &amp; speichern</button></div><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`)}
function buildShareText(){let arr=computeStandings();let lines=[`⛳ Golf Deluxe – ${modeLabel()}`,`Platz: ${S.courseName||'Varus'}`,''];arr.forEach((x,i)=>lines.push(`${i+1}. ${x[0]}: ${x[1]}`));return lines.join('\n')}
function shareRound(){let text=buildShareText();if(navigator.share){navigator.share({title:'Golf Deluxe Ergebnis',text}).catch(()=>{})}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>showModal(`<h2>Kopiert</h2><p>Das Ergebnis wurde in die Zwischenablage kopiert.</p><div class="modalActions"><button class="close" onclick="closeModal()">OK</button></div>`)).catch(()=>showModal(`<h2>Ergebnis</h2><p style="white-space:pre-wrap">${esc(text)}</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`))}else{showModal(`<h2>Ergebnis</h2><p style="white-space:pre-wrap">${esc(text)}</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`)}}
function exportScorecardImage(){
  let arr=computeStandings();
  let w=640,h=130+arr.length*54;
  let canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  let ctx=canvas.getContext('2d');
  ctx.fillStyle='#07100b';ctx.fillRect(0,0,w,h);
  ctx.fillStyle='#f4f7f4';ctx.font='bold 26px sans-serif';ctx.fillText('⛳ Golf Deluxe – '+modeLabel(),24,44);
  ctx.font='14px sans-serif';ctx.fillStyle='#9eaa9f';ctx.fillText(S.courseName||'Varus',24,68);
  ctx.font='bold 20px sans-serif';
  arr.forEach((x,i)=>{
    let y=118+i*54;
    ctx.fillStyle='#f4f7f4';ctx.textAlign='left';ctx.fillText(`${i+1}. ${x[0]}`,24,y);
    ctx.fillStyle='#68c487';ctx.textAlign='right';ctx.fillText(String(x[1]),w-24,y);
  });
  canvas.toBlob(blob=>{
    if(!blob)return;
    let file=new File([blob],'golf-deluxe-ergebnis.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:'Golf Deluxe Ergebnis'}).catch(()=>{});
    } else {
      let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='golf-deluxe-ergebnis.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    }
  },'image/png');
}
function getHistory(){try{let h=JSON.parse(localStorage.getItem('gd_history')||'[]');return Array.isArray(h)?h:[]}catch(e){return []}}
function computeBadges(){
  let badges=[];
  if(['count','short','stable'].includes(S.mode)){
    let birdieCounts=Array(S.count).fill(0);
    for(let h=0;h<18;h++){
      let par=S.mode==='short'?S.par:S.settings[h][1];
      for(let p=0;p<S.count;p++){let g=Number(getData([S.mode,h,p],''));if(g&&g<par)birdieCounts[p]++;}
    }
    let max=Math.max(...birdieCounts);
    if(max>0){let winners=names().filter((n,p)=>birdieCounts[p]===max);badges.push({icon:'🐦',title:`Meiste Birdies (${max})`,player:winners.join(', ')});}
  }
  if(S.mode==='fun'){
    let bonusSums=Array.from({length:S.count},(_,p)=>Array.from({length:18},(_,h)=>bonusFor(h,p)).reduce((a,b)=>a+b,0));
    let max=Math.max(...bonusSums);
    if(max>0){let winners=names().filter((n,p)=>bonusSums[p]===max);badges.push({icon:'⭐',title:`Bonus-Champion (${max} Pkt)`,player:winners.join(', ')});}
  }
  if(S.mode==='wolf'){
    let pts=Array.from({length:S.count},(_,p)=>Array.from({length:18},(_,h)=>wolfPoints(S.count,h%S.count,getData(['wolf',h,'pick'],''),getData(['wolf',h,'result'],'geteilt'))[p]).reduce((a,b)=>a+b,0));
    let max=Math.max(...pts);
    if(max>0){let winners=names().filter((n,p)=>pts[p]===max);badges.push({icon:'🐺',title:`Wolf-König (${max} Pkt)`,player:winners.join(', ')});}
  }
  if(S.mode==='count'){
    for(let p=0;p<S.count;p++){
      let front=0,back=0,anyF=false,anyB=false;
      for(let h=0;h<9;h++){let g=Number(getData(['count',h,p],''));if(g){front+=g;anyF=true}}
      for(let h=9;h<18;h++){let g=Number(getData(['count',h,p],''));if(g){back+=g;anyB=true}}
      if(anyF&&anyB&&back<front){badges.push({icon:'🔥',title:`Starke Rückneun (${back} vs ${front})`,player:playerName(p)});}
    }
  }
  return badges;
}
function saveRoundToHistory(){let arr=computeStandings();let badges=computeBadges();let entry={date:new Date().toISOString(),mode:S.mode,modeLabel:modeLabel(),course:S.courseName||'Varus',standings:arr,badges};let hist=getHistory();hist.unshift(entry);if(hist.length>50)hist.length=50;localStorage.setItem('gd_history',JSON.stringify(hist));return {arr,badges}}
function historyView(){let hist=getHistory();if(!hist.length){showModal(`<h2>📜 Rundenverlauf</h2><p>Noch keine abgeschlossenen Runden gespeichert.</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);return}showModal(`<h2>📜 Rundenverlauf</h2><div class="bonusList">${hist.map(r=>`<div class="bonusItem" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center"><b>${esc(r.modeLabel)}</b><em>${esc(new Date(r.date).toLocaleDateString('de-DE'))}</em></div><div class="sub" style="margin:4px 0">${esc(r.course)}</div>${r.standings.map((x,i)=>`<div class="sub">${i+1}. ${esc(x[0])}: ${x[1]}</div>`).join('')}${r.badges&&r.badges.length?`<div class="sub" style="margin-top:4px">${r.badges.map(b=>`${b.icon} ${esc(b.title)} – ${esc(b.player)}`).join('<br>')}</div>`:''}</div>`).join('')}</div><div class="section"><button class="secondary" onclick="statsView()">📈 Statistik</button></div><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button><button class="close danger" onclick="clearHistoryConfirm()">Verlauf löschen</button></div>`)}
function clearHistoryConfirm(){showModal(`<h2>Verlauf löschen?</h2><p>Alle gespeicherten Rundenergebnisse werden entfernt.</p><div class="modalActions"><button class="close" onclick="historyView()">Abbrechen</button><button class="close danger" onclick="localStorage.removeItem('gd_history');closeModal()">Löschen</button></div>`)}
function sparkline(vals){
  if(vals.length<2)return `<div class="sub">Zu wenige Runden für einen Trend.</div>`;
  let w=260,h=48,pad=4;let min=Math.min(...vals),max=Math.max(...vals);if(min===max){min-=1;max+=1;}
  let pts=vals.map((v,i)=>{let x=pad+(i/(vals.length-1))*(w-2*pad);let y=h-pad-((v-min)/(max-min))*(h-2*pad);return `${x.toFixed(1)},${y.toFixed(1)}`;}).join(' ');
  return `<svg width="${w}" height="${h}" style="display:block;margin-top:6px"><polyline points="${pts}" fill="none" stroke="#68c487" stroke-width="2"/></svg>`;
}
function statsView(){
  let hist=getHistory();
  if(!hist.length){showModal(`<h2>📈 Statistik</h2><p>Noch keine abgeschlossenen Runden gespeichert.</p><div class="modalActions"><button class="close" onclick="historyView()">Zurück</button></div>`);return;}
  let byPlayer={};
  hist.slice().reverse().forEach(r=>{r.standings.forEach(([name,val])=>{byPlayer[name]=byPlayer[name]||[];byPlayer[name].push(val);});});
  let pnames=Object.keys(byPlayer);
  showModal(`<h2>📈 Statistik</h2><p>Verlauf der letzten Rundenergebnisse (unabhängig vom Modus, chronologisch).</p>
  <div class="bonusList">${pnames.map(n=>`<div class="bonusItem" style="display:block"><b>${esc(n)}</b>${sparkline(byPlayer[n])}<div class="sub">Letzte ${byPlayer[n].length} Runden</div></div>`).join('')}</div>
  <div class="modalActions"><button class="close" onclick="historyView()">Zurück</button><button class="close" onclick="closeModal()">Schließen</button></div>`);
}
function finishRoundConfirm(){showModal(`<h2>Runde abschließen?</h2><p>Das Ergebnis wird im Rundenverlauf gespeichert. Anschließend kannst du eine neue Runde starten.</p><div class="modalActions"><button class="close" onclick="closeModal()">Abbrechen</button><button class="close danger" onclick="finishRound()">Speichern &amp; beenden</button></div>`)}
function finishRound(){let {badges}=saveRoundToHistory();if(badges&&badges.length){showModal(`<h2>🏅 Ehrenrunde</h2><p>Auszeichnungen dieser Runde:</p><div class="bonusList">${badges.map(b=>`<div class="bonusItem"><div>${b.icon} <b>${esc(b.title)}</b></div><em>${esc(b.player)}</em></div>`).join('')}</div><div class="modalActions"><button class="close danger" onclick="resetGame()">Weiter</button></div>`);}else{resetGame();}}

/* ---------- Info / Modal ---------- */
function showInfo(m){showModal(`<h2>${esc(MODES.find(x=>x[0]===m)?.[1]||'Regeln')}</h2><p>${esc(MODEINFO[m]||'')}</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`)}
function showModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="modalBox animate">${html}</div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function resetConfirm(){showModal(`<h2>Spiel zurücksetzen?</h2><p>Alle Eintragungen dieses Spiels werden gelöscht. Die Platzdaten und Einstellungen bleiben erhalten. Vor dem Löschen wird automatisch eine Sicherung angelegt, die du bei Bedarf wiederherstellen kannst.</p><div class="modalActions"><button class="close" onclick="closeModal()">Abbrechen</button><button class="close danger" onclick="resetGame()">Alles löschen</button></div>`)}
function resetGame(){
  try{localStorage.setItem('gd_last_backup',JSON.stringify({state:S,ts:Date.now()}))}catch(e){}
  let keep={settings:S.settings,players:S.players,count:S.count,team:S.team,mode:S.mode,par:S.par,stableHcp:S.stableHcp,courseName:S.courseName,matchHcp:S.matchHcp,teamFormatHcp:S.teamFormatHcp,wolfBlind:S.wolfBlind,funUnique:S.fun?S.fun.unique:false};
  S=blankState();
  S.settings=keep.settings;S.players=keep.players;S.count=keep.count;S.team=keep.team;S.mode=keep.mode;S.par=keep.par;S.stableHcp=keep.stableHcp;S.courseName=keep.courseName;
  S.matchHcp=keep.matchHcp;S.teamFormatHcp=keep.teamFormatHcp;S.wolfBlind=keep.wolfBlind;S.fun.unique=keep.funUnique;
  save();closeModal();render();
}
function hasResetBackup(){try{return !!localStorage.getItem('gd_last_backup')}catch(e){return false}}
function restoreBackupConfirm(){
  let raw=localStorage.getItem('gd_last_backup');
  if(!raw){showModal(`<h2>Keine Sicherung</h2><p>Es ist keine Sicherung eines zurückgesetzten Spiels vorhanden.</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);return;}
  let b;try{b=JSON.parse(raw)}catch(e){b=null}
  if(!b){showModal(`<h2>Sicherung beschädigt</h2><p>Die Sicherung konnte nicht gelesen werden.</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);return;}
  showModal(`<h2>Letzten Reset wiederherstellen?</h2><p>Sicherung vom ${esc(new Date(b.ts).toLocaleString('de-DE'))} (${esc(MODES.find(m=>m[0]===b.state.mode)?.[1]||'unbekannter Modus')}). Der aktuelle Spielstand wird dabei überschrieben.</p><div class="modalActions"><button class="close" onclick="closeModal()">Abbrechen</button><button class="close danger" onclick="restoreBackup()">Wiederherstellen</button></div>`);
}
function restoreBackup(){let raw=localStorage.getItem('gd_last_backup');if(!raw)return;try{let b=JSON.parse(raw);S=Object.assign(blankState(),b.state);save();closeModal();render();}catch(e){closeModal();}}
function homeConfirm(){showModal(`<h2>Zur Startseite?</h2><p>Der aktuelle Spielstand bleibt gespeichert. Du kannst später weiterspielen.</p><div class="modalActions"><button class="close" onclick="closeModal()">Bleiben</button><button class="close danger" onclick="S.screen='home';save();closeModal();render()">Zur Startseite</button></div>`)}
function courseSettings(){
  let courses=loadCourses();let th=loadTeamHcp();
  showModal(`<h2>⚙ Platzdaten &amp; Einstellungen</h2><p>Aktueller Platz: <b>${esc(S.courseName||'Varus')}</b>. Wähle einen gespeicherten Platz oder passe PAR/HCP unten an.</p><div class="section"><div class="label">Gespeicherter Platz</div><select class="select" onchange="switchCourse(this.value)">${courses.map(c=>`<option value="${esc(c.name)}" ${c.name===S.courseName?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="settingsGrid">${S.settings.map((r,i)=>`<div class="settingCard"><label>Loch ${i+1}</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input class="numInput" type="number" min="1" max="9" value="${r[1]}" onchange="S.settings[${i}][1]=Math.max(1,Math.min(9,Number(this.value)||4));localStorage.setItem('gd_course',JSON.stringify(S.settings));save()"><input class="numInput" type="number" min="1" max="18" value="${r[2]}" onchange="S.settings[${i}][2]=Math.max(1,Math.min(18,Number(this.value)||1));localStorage.setItem('gd_course',JSON.stringify(S.settings));save()"></div></div>`).join('')}</div><div class="section"><div class="label">Aktuelle Werte als neuer Platz speichern</div><div class="playerRow"><input class="textInput" id="newCourseName" placeholder="Name, z. B. Golfclub Nord"><button class="smallBtn" onclick="saveAsNewCourse()">Speichern</button></div></div>
  <div class="section"><div class="label">Team-Vorgabe-Faktoren</div><div class="settingsGrid">
  <div class="settingCard"><label>Scramble niedrig (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.scrLow}" onchange="updateTeamHcp('scrLow',this.value)"></div>
  <div class="settingCard"><label>Scramble hoch (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.scrHigh}" onchange="updateTeamHcp('scrHigh',this.value)"></div>
  <div class="settingCard"><label>Fourball Faktor (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.fb}" onchange="updateTeamHcp('fb',this.value)"></div>
  <div class="settingCard"><label>Chapman niedrig (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.chLow}" onchange="updateTeamHcp('chLow',this.value)"></div>
  <div class="settingCard"><label>Chapman hoch (0–1)</label><input class="numInput" type="number" step="0.05" min="0" max="1" value="${th.chHigh}" onchange="updateTeamHcp('chHigh',this.value)"></div>
  </div></div>
  <div class="modalActions"><button class="close" onclick="closeModal();save();render()">Fertig</button><button class="close danger" onclick="restoreCourse()">Varus zurücksetzen</button></div>${S.courseName&&S.courseName!=='Varus'?`<button class="close danger" style="width:100%;margin-top:8px" onclick="deleteCourse()">„${esc(S.courseName)}" löschen</button>`:''}`);
}
function switchCourse(name){let courses=loadCourses();let c=courses.find(x=>x.name===name);if(!c)return;S.courseName=name;S.settings=c.holes.map(x=>[...x]);localStorage.setItem('gd_course',JSON.stringify(S.settings));localStorage.setItem('gd_active_course',JSON.stringify(name));save();courseSettings()}
function saveAsNewCourse(){let input=document.getElementById('newCourseName');let name=(input&&input.value||'').trim();if(!name)return;let courses=loadCourses();let idx=courses.findIndex(c=>c.name===name);let entry={name,holes:S.settings.map(x=>[...x])};if(idx>=0)courses[idx]=entry;else courses.push(entry);saveCourses(courses);S.courseName=name;localStorage.setItem('gd_active_course',JSON.stringify(name));save();courseSettings()}
function deleteCourse(){let courses=loadCourses().filter(c=>c.name!==S.courseName);saveCourses(courses);let varus=courses.find(c=>c.name==='Varus')||defaultCourses()[0];S.courseName='Varus';S.settings=varus.holes.map(x=>[...x]);localStorage.setItem('gd_course',JSON.stringify(S.settings));localStorage.setItem('gd_active_course',JSON.stringify('Varus'));save();courseSettings()}
function restoreCourse(){S.settings=HOLES.map(x=>[...x]);S.courseName='Varus';localStorage.setItem('gd_course',JSON.stringify(S.settings));localStorage.setItem('gd_active_course',JSON.stringify('Varus'));save();courseSettings()}
function startGame(){
  if(!S.mode){showModal('<h2>Modus auswählen</h2><p>Bitte wähle zuerst einen Spielmodus.</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>');return}
  let n=S.count;let err='';
  if(S.mode==='531'&&n!==3)err='5–3–1 benötigt genau 3 Spieler.';
  if(S.mode==='vegas'&&n!==4)err='Las Vegas benötigt genau 4 Spieler.';
  if(['scramble','chapman','fourball'].includes(S.mode)&&n!==4)err='Dieser Modus benötigt genau 4 Spieler (2 Teams à 2).';
  if(S.mode==='wolf'&&n<3)err='Wolf benötigt 3 oder 4 Spieler.';
  if(S.mode==='bbb'&&n<2)err='Bingo Bango Bongo benötigt mindestens 2 Spieler.';
  if(S.mode==='skins'&&n<2)err='Skins benötigt mindestens 2 Spieler.';
  if(S.mode==='nassau'&&n<2)err='Nassau benötigt mindestens 2 Spieler.';
  if(S.mode==='fun'&&n<2)err='Fun benötigt mindestens 2 Spieler.';
  if(S.mode==='match'&&![2,4].includes(n))err='Matchplay benötigt 2 oder 4 Spieler.';
  if(S.mode==='match'&&n===4)S.team=true;
  if(err){showModal(`<h2>Spieleranzahl</h2><p>${esc(err)}</p><div class="modalActions"><button class="close" onclick="closeModal()">Schließen</button></div>`);return}
  S.players=Array.from({length:n},(_,i)=>S.players[i]?.trim()||`Spieler ${i+1}`);
  S.screen='game';save();render();scrollToCurrentHole();
}
function liveRefresh(el){const inputs=[...document.querySelectorAll('input')];const idx=inputs.indexOf(el);const st=typeof el.selectionStart==='number'?el.selectionStart:null,en=typeof el.selectionEnd==='number'?el.selectionEnd:null;render();const next=[...document.querySelectorAll('input')][idx];if(next){next.focus();if(st!==null&&next.setSelectionRange){try{next.setSelectionRange(st,en)}catch(e){}}}}
function updateScorebar(){let el=document.getElementById('scorebar');if(el)el.remove();if(S.screen!=='game')return;let vals=isTeam()?[['Team A',scoreFor(0)+ (S.mode==='count'||S.mode==='fun'?scoreFor(1):0)],['Team B',scoreFor(2)+ (S.mode==='count'||S.mode==='fun'?scoreFor(3):0)]]:names().map((n,p)=>[n,scoreFor(p)]);let bar=document.createElement('div');bar.id='scorebar';bar.className='scorebar';bar.innerHTML=vals.map(x=>`<div class="scorechip"><b>${esc(x[1])}</b><small>${esc(x[0])}</small></div>`).join('');document.body.appendChild(bar)}
applyTheme();
render();
</script></body></html>
